# Managed by IDE Development — do not edit by hand in consumers.
# Sync: scripts/sync-managed-workflows.sh
#
# TRUST BOUNDARY: privileged jobs check out the default branch only.
# App token is minted and consumed in the SAME job (never via job outputs).
# Approve-merge binds staging source SHA, prior main target SHA, and promote head.
#
# Consumers: workflow_run.workflows is STATIC YAML — list every gate-producing
# workflow display name (IDE: CI + Branch Source Policy).
name: LiNKtrend Staging To Main

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "package | approve-merge | reevaluate"
        type: choice
        options:
          - package
          - approve-merge
          - reevaluate
        default: package
      expected_sha:
        description: "approve-merge: exact staging source SHA"
        required: false
        type: string
      expected_main_sha:
        description: "approve-merge: prior main target SHA"
        required: false
        type: string
      expected_promote_head:
        description: "approve-merge / reevaluate: exact promote PR head SHA"
        required: false
        type: string
      promote_pr_number:
        description: "reevaluate / approve-merge: exact promote PR number"
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  check_run:
    types: [completed]
  workflow_run:
    workflows:
      - CI
      - Branch Source Policy
    types: [completed]

permissions: {}

concurrency:
  group: staging-to-main
  cancel-in-progress: false

env:
  TIMEZONE_LABEL: "Asia/Taipei"
  RELEASE_GATE_CHECKS: ${{ vars.LINKTREND_RELEASE_GATE_CHECKS || 'Verify IDE Development,Enforce allowed PR source branches' }}

jobs:
  promote:
    # Filter BEFORE checkout/token mint. Only promote/main/* → main.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.head_ref, 'promote/main/')
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'promote/main/')
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug != 'github-actions' &&
        github.event.check_run.name != 'Linktrend Main Outcome' &&
        github.event.check_run.name != 'Linktrend Staging Outcome' &&
        github.event.check_run.name != 'Linktrend Packager Result' &&
        github.event.check_run.name != 'Linktrend Integrator Result' &&
        github.event.check_run.pull_requests[0].base.ref == 'main' &&
        startsWith(github.event.check_run.pull_requests[0].head.ref, 'promote/main/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      statuses: read
      pull-requests: read
    env:
      OUTCOME_CHECK_NAME: Linktrend Main Outcome
      RELEASE_GATE_CHECKS: ${{ env.RELEASE_GATE_CHECKS }}
      REQUIRE_APP_TOKEN: "1"
      LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Resolve mode and exact candidate
        id: ctx
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PROMOTE_PREFIX: "promote/main/"
          INPUT_ACTION: ${{ github.event.inputs.action }}
          INPUT_PR: ${{ github.event.inputs.promote_pr_number }}
          INPUT_STG: ${{ github.event.inputs.expected_sha }}
          INPUT_MAIN: ${{ github.event.inputs.expected_main_sha }}
          INPUT_HEAD: ${{ github.event.inputs.expected_promote_head }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MODE="reevaluate"
          PR=""
          SHA=""
          STG=""
          MAIN=""
          SKIP=""
          case "${GITHUB_EVENT_NAME}" in
            schedule)
              MODE="package"
              ;;
            workflow_dispatch)
              case "${INPUT_ACTION:-package}" in
                package) MODE="package" ;;
                approve-merge) MODE="approve-merge" ;;
                *) MODE="reevaluate" ;;
              esac
              PR="${INPUT_PR:-}"
              SHA="${INPUT_HEAD:-}"
              STG="${INPUT_STG:-}"
              MAIN="${INPUT_MAIN:-}"
              ;;
            pull_request_target|check_run|workflow_run)
              MODE="reevaluate"
              mapfile -t _lines < <(python3 scripts/gitops/resolve_event_pr.py)
              for line in "${_lines[@]}"; do
                case "$line" in
                  pr=*) PR="${line#pr=}" ;;
                  head=*) SHA="${line#head=}" ;;
                esac
              done
              if [ -z "${PR}" ]; then
                SKIP="true"
              fi
              if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
                case "${HEAD_REF}" in
                  promote/main/*) ;;
                  *) SKIP="true" ;;
                esac
              fi
              ;;
          esac
          {
            echo "mode=${MODE}"
            echo "pr=${PR}"
            echo "sha=${SHA}"
            echo "stg=${STG}"
            echo "main=${MAIN}"
            echo "skip=${SKIP}"
          } >> "$GITHUB_OUTPUT"

      - name: Check App token minted
        id: creds
        env:
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if source scripts/gitops/resolve_automation_token.sh; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report credentials blocked
        if: steps.creds.outputs.ready != 'true'
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/gitops/write_outcome.py \
            --status automation_credentials_blocked \
            --detail "LINKTREND_GITOPS_APP_ID / minted App token required for autonomous main promotion." \
            --check-name "$OUTCOME_CHECK_NAME" \
            --head-sha "$HEAD_SHA" \
            --token-env GITHUB_TOKEN
          exit 1

      - name: Configure git remote for App token pushes
        if: steps.ctx.outputs.skip != 'true' && steps.creds.outputs.ready == 'true'
        env:
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run main promotion
        if: steps.ctx.outputs.skip != 'true' && steps.creds.outputs.ready == 'true'
        env:
          MODE: ${{ steps.ctx.outputs.mode }}
          PROMOTE_PR_NUMBER: ${{ steps.ctx.outputs.pr }}
          EXPECTED_PROMOTE_HEAD: ${{ steps.ctx.outputs.sha }}
          EXPECTED_STAGING_SHA: ${{ steps.ctx.outputs.stg }}
          EXPECTED_MAIN_SHA: ${{ steps.ctx.outputs.main }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          if [ "${MODE}" = "approve-merge" ]; then
            if [ -z "${EXPECTED_STAGING_SHA}" ] || [ -z "${EXPECTED_PROMOTE_HEAD}" ] || [ -z "${EXPECTED_MAIN_SHA}" ]; then
              python3 scripts/gitops/write_outcome.py \
                --status failed \
                --detail "approve-merge requires expected_sha, expected_main_sha, and expected_promote_head"
              exit 1
            fi
          fi
          bash scripts/gitops/promote_main.sh
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          detail="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json")).get("detail",""))')"
          sha="${EXPECTED_PROMOTE_HEAD:-$GITHUB_SHA}"
          python3 scripts/gitops/write_outcome.py \
            --status "$status" \
            --detail "$detail" \
            --check-name "$OUTCOME_CHECK_NAME" \
            --head-sha "$sha" \
            --token-env GH_TOKEN
          echo "### Main outcome: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - name: Skip noise events
        if: steps.ctx.outputs.skip == 'true' && steps.creds.outputs.ready == 'true'
        run: |
          python3 scripts/gitops/write_outcome.py \
            --status skipped \
            --detail "no exact promote/main candidate for this event"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-promote-report
          path: |
            gitops-outcome.json
            main-promote-report.md
            release-gate-wait.json
          if-no-files-found: ignore
