name: LiNKtrend Staging To Main

# Mon 08:00 Asia/Taipei = 00:00 UTC — package temporary promote/main/* PR.
# Merge only on workflow_dispatch action=approve-merge with exact SHA bindings.
# Never direct-push main.

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "package = open/refresh promote PR; approve-merge = merge after Principal Approve"
        type: choice
        options:
          - package
          - approve-merge
        default: package
      expected_sha:
        description: "Exact staging SHA required for approve-merge"
        required: false
        type: string
      expected_promote_head:
        description: "Exact promote PR head SHA required for approve-merge"
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  issues: write

env:
  TIMEZONE_LABEL: "Asia/Taipei"
  RELEASE_GATE_CHECKS: ${{ vars.LINKTREND_RELEASE_GATE_CHECKS || 'Verify IDE Development' }}

jobs:
  package:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'package')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package main promote candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: package
          RELEASE_GATE_CHECKS: ${{ env.RELEASE_GATE_CHECKS }}
        run: bash scripts/gitops/promote_main.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-package-report
          path: |
            main-promote-report.md
            .linktrend/conflict-tasks/
          if-no-files-found: ignore

  merge-on-approve:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'approve-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Approve-merge exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: approve-merge
          EXPECTED_STAGING_SHA: ${{ inputs.expected_sha || '' }}
          EXPECTED_PROMOTE_HEAD: ${{ inputs.expected_promote_head || '' }}
          RELEASE_GATE_CHECKS: ${{ env.RELEASE_GATE_CHECKS }}
        run: bash scripts/gitops/promote_main.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-approve-report
          path: |
            main-promote-report.md
            release-gate-wait.json
          if-no-files-found: ignore
