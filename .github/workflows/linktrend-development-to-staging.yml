name: LiNKtrend Development To Staging

# Tuesday and Friday 10:00 Asia/Taipei = 02:00 UTC.
# Temporary promote/staging/* branch + PR only. Never direct-push staging.

on:
  schedule:
    - cron: "0 2 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this promotion run is needed"
        required: false
        default: "manual"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging]
  check_run:
    types: [completed]
  issues:
    types: [edited, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  issues: write

concurrency:
  group: linktrend-development-to-staging-${{ github.repository }}
  cancel-in-progress: false

env:
  TIMEZONE_LABEL: "Asia/Taipei"
  STAGING_GATE_CHECKS: ${{ vars.LINKTREND_STAGING_GATE_CHECKS || 'Verify IDE Development' }}

jobs:
  promote-development:
    name: Promote via temporary branch
    # Scheduled/manual: build candidate. PR/check events on promote branches: reevaluate merge.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'promote/staging/')) ||
      (github.event_name == 'check_run' && contains(join(github.event.check_run.pull_requests.*.head.ref, ','), 'promote/staging/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote or reevaluate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_GATE_CHECKS: ${{ env.STAGING_GATE_CHECKS }}
          TIMEZONE_LABEL: ${{ env.TIMEZONE_LABEL }}
        run: bash scripts/gitops/promote_staging.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-promote-report
          path: |
            staging-promote-report.md
            staging-gate-wait.json
            .linktrend/conflict-tasks/
          if-no-files-found: ignore
