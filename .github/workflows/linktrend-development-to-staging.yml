name: LiNKtrend Development To Staging

# Tue/Fri 10:00 Asia/Taipei = 02:00 UTC
# build on schedule/manual; reevaluate on promote PR/check (never rebuilds)

on:
  schedule:
    - cron: "0 2 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this promotion run is needed"
        required: false
        default: "manual"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  issues: write

concurrency:
  group: linktrend-development-to-staging-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  TIMEZONE_LABEL: "Asia/Taipei"
  STAGING_GATE_CHECKS: ${{ vars.LINKTREND_STAGING_GATE_CHECKS || 'Verify IDE Development' }}

jobs:
  build:
    name: Build staging candidate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: build
          STAGING_GATE_CHECKS: ${{ env.STAGING_GATE_CHECKS }}
        run: bash scripts/gitops/promote_staging.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-build-report
          path: staging-promote-report.md
          if-no-files-found: ignore

  reevaluate:
    name: Reevaluate staging promote PR
    if: >
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'promote/staging/')) ||
      (github.event_name == 'check_run' && contains(join(github.event.check_run.pull_requests.*.head.ref, ','), 'promote/staging/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reevaluate (no rebuild/push)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: reevaluate
          STAGING_GATE_CHECKS: ${{ env.STAGING_GATE_CHECKS }}
          GATE_WAIT_SECONDS: "180"
        run: bash scripts/gitops/promote_staging.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-reevaluate-report
          path: |
            staging-promote-report.md
            staging-gate-wait.json
          if-no-files-found: ignore
