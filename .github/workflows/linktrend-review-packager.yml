# Review Packager — discovery + evaluate
# Privileged jobs ALWAYS checkout the repository default branch for scripts.
# Never execute PR head/merge code with write credentials.
#
# Wake paths:
#   - schedule / workflow_dispatch → discover (draft PRs only)
#   - pull_request_target → initial evaluate (trusted workflow + scripts)
#   - workflow_run (CI) → Actions fast-gate completion (check_run is suppressed for Actions)
#   - check_run → external apps only (e.g. Cursor Bugbot); github-actions filtered out
#
# Consumers: map gate workflow *names* into workflow_run.workflows (IDE uses "CI").

name: Linktrend Review Packager

on:
  schedule:
    - cron: "0 0 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this packaging run is needed"
        required: false
        default: "manual"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
  workflow_run:
    workflows:
      - CI
    types: [completed]
  check_run:
    types: [completed]

permissions: {}

concurrency:
  group: linktrend-review-packager-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.check_run.id || github.run_id }}
  cancel-in-progress: false

env:
  BUGBOT_REVIEW_COMMAND: ${{ vars.LINKTREND_BUGBOT_REVIEW_COMMAND || 'cursor review' }}
  FAST_GATE_CHECKS: ${{ vars.LINKTREND_INTEGRATOR_REQUIRED_CHECKS || 'Verify IDE Development' }}

jobs:
  discover:
    name: Discover ready tips (draft PRs only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Discover
        env:
          LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_APP_TOKEN: "1"
        run: |
          set -euo pipefail
          if ! source scripts/gitops/resolve_automation_token.sh; then
            python3 scripts/gitops/write_outcome.py \
              --status automation_credentials_blocked \
              --detail "App token unavailable for Packager discover"
            echo "### Packager discover: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export AUTOMATION_TOKEN AUTOMATION_TOKEN_SOURCE AUTOMATION_CREDENTIALS_STATUS
          python3 scripts/gitops/packager_discover.py
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          echo "### Packager discover: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-discover-report
          path: |
            packager-discover-report.json
            gitops-outcome.json
          if-no-files-found: ignore

  evaluate:
    name: Evaluate draft PR after gates
    if: >
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'CI'
      ) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug != 'github-actions' &&
       github.event.check_run.name != 'Linktrend Packager Result' &&
       github.event.check_run.name != 'Linktrend Integrator Result' &&
       github.event.check_run.name != 'Linktrend Staging Outcome' &&
       github.event.check_run.name != 'Linktrend Main Outcome' &&
       github.event.check_run.name != 'evaluate')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Resolve PR/head from trusted event fields
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t _lines < <(python3 scripts/gitops/resolve_event_pr.py)
          PR=""
          HEAD=""
          for line in "${_lines[@]}"; do
            case "$line" in
              pr=*) PR="${line#pr=}" ;;
              head=*) HEAD="${line#head=}" ;;
            esac
          done
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD}" >> "$GITHUB_OUTPUT"

      - name: Evaluate one PR
        env:
          LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BUGBOT_REVIEW_COMMAND: ${{ env.BUGBOT_REVIEW_COMMAND }}
          FAST_GATE_CHECKS: ${{ env.FAST_GATE_CHECKS }}
          REQUIRE_APP_TOKEN: "1"
        run: |
          set -euo pipefail
          if ! source scripts/gitops/resolve_automation_token.sh; then
            python3 scripts/gitops/write_outcome.py \
              --status automation_credentials_blocked \
              --detail "App token unavailable for Packager evaluate" \
              --check-name "Linktrend Packager Result" \
              --head-sha "${HEAD_SHA}" \
              --token-env GITHUB_TOKEN
            echo "### Packager evaluate: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export AUTOMATION_TOKEN AUTOMATION_TOKEN_SOURCE AUTOMATION_CREDENTIALS_STATUS
          python3 scripts/gitops/packager_evaluate.py
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          detail="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json")).get("detail",""))')"
          echo "### Packager evaluate: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
          # Job green means evaluator ran. Terminal success is only via Result check
          # for bugbot_requested / packaged — not mere script execution.
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-evaluate-report
          path: |
            packager-evaluate-report.json
            gitops-outcome.json
          if-no-files-found: ignore
