name: IDE Development Cross-Platform Matrix

# Cross-platform installer matrix for Phase candidates that change installer,
# workflow, fixture, or environment inputs. The path classifier is shared with
# merge_check.py and the main promotion gate.
# Uses standard GitHub-hosted runners exclusively (no self-hosted labels).

on:
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/**"
      - ".github/linktrend-*"
      - "core/managed-core/**"
      - "core/github/managed-workflows/**"
      - "scripts/ide_development/**"
      - "scripts/ide_development_tests/**"
      - "scripts/platform_matrix/**"
      - "tests/platform_matrix/**"
      - "scripts/run_cross_platform_matrix.py"
      - "scripts/wire-repo.sh"
      - "scripts/sync-managed-workflows.sh"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/Pipfile"
      - "**/Pipfile.lock"
      - "**/poetry.lock"
      - "**/uv.lock"

permissions:
  contents: read

concurrency:
  group: ide-cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-matrix:
    if: startsWith(github.head_ref, 'phase/')
    name: Installer matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Assert fixture payloads stay LF (Windows hash identity)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("scripts/ide_development_tests/fixtures/package_v2")
          core = root / "core/managed-core/files/CORE.txt"
          data = core.read_bytes()
          if b"\r\n" in data:
              raise SystemExit(f"CRLF leaked into fixture: {core}")
          expected = "sha256:65fe6ffd79bb47d55d9bf51c372a3e3c2a4246af66a4247cb756efb71b192520"
          actual = "sha256:" + hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"fixture hash drift: {actual} != {expected}")
          print("fixture LF + hash OK", actual)
          PY

      - name: Run cross-platform installer matrix
        shell: bash
        run: python3 scripts/run_cross_platform_matrix.py

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-matrix-summary-${{ matrix.os }}
          path: tests/platform_matrix/summaries/
          if-no-files-found: warn
