# Linktrend Managed-Core Release Publisher — built-in-token immutable publication
#
# System-repository only (IDE Development). Not synced to consumers via
# scripts/sync-managed-workflows.sh — consumers must not publish managed-core.
#
# Privileged tag + GitHub Release publication for managed-core v2.5.0.
# Workflow YAML and publish scripts come from the protected default branch only.
# The requested source SHA is checked out as data only — never execute untrusted
# tip code with write credentials.
#
# Identity: GitHub Actions built-in token with release-scoped contents permission.
# Fail closed when source SHA does not equal the default-branch tip or on
# tag/release/checksum conflict/replay.
#
# Trigger: workflow_dispatch. dry_run / action=verify-only validate and rebuild
# without creating a tag or Release.
# Input validation: scripts/gitops/managed_core_release_dispatch.py
# Publish helper: scripts/gitops/managed_core_release_publish.py

name: Linktrend Managed-Core Release Publisher

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Immutable 40-char source SHA (must equal remote default-branch tip)"
        required: true
        type: string
      version:
        description: "Package semver (authorized: 2.5.0)"
        required: false
        type: string
        default: "2.5.0"
      tag:
        description: "Immutable release tag (must be v<version>)"
        required: false
        type: string
        default: "v2.5.0"
      action:
        description: "publish (default) or verify-only"
        required: false
        type: choice
        options:
          - publish
          - verify-only
        default: publish
      dry_run:
        description: "Rebuild/verify/bindings only; do not create tag or GitHub Release"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: linktrend-managed-core-release-publisher-${{ inputs.tag }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild, verify, and publish managed-core release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch only (scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dispatch inputs
        id: inputs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 scripts/gitops/managed_core_release_dispatch.py validate \
            --source-sha "${INPUT_SOURCE_SHA}" \
            --version "${INPUT_VERSION}" \
            --tag "${INPUT_TAG}" \
            --action "${INPUT_ACTION}" \
            --dry-run "${INPUT_DRY_RUN}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --github-output

      - name: Checkout source SHA as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.inputs.outputs.source_sha }}
          path: untrusted-source-data
          fetch-depth: 1
          persist-credentials: false

      - name: Bind data checkout HEAD to requested source SHA
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          data_sha="$(git -C untrusted-source-data rev-parse HEAD)"
          data_sha="$(printf '%s' "${data_sha}" | tr '[:upper:]' '[:lower:]')"
          want="$(printf '%s' "${SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [ "${data_sha}" != "${want}" ]; then
            echo "FAIL: untrusted-source-data HEAD=${data_sha} != source_sha=${want}" >&2
            exit 1
          fi
          trusted_sha="$(git rev-parse HEAD)"
          trusted_sha="$(printf '%s' "${trusted_sha}" | tr '[:upper:]' '[:lower:]')"
          if [ "${trusted_sha}" != "${want}" ]; then
            echo "FAIL: trusted default-branch HEAD=${trusted_sha} != source_sha=${want}" >&2
            exit 1
          fi

      - name: Rebuild, verify, and publish or dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
          VERSION: ${{ steps.inputs.outputs.version }}
          TAG: ${{ steps.inputs.outputs.tag }}
          ACTION: ${{ steps.inputs.outputs.action }}
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          DEFAULT_BRANCH: ${{ steps.inputs.outputs.default_branch }}
        run: |
          set -euo pipefail
          DATA_ROOT="$(pwd)/untrusted-source-data"
          TRUSTED_ROOT="$(pwd)"
          if [ "${DATA_ROOT}" = "${TRUSTED_ROOT}" ]; then
            echo "FAIL: untrusted data path collapsed into trusted root" >&2
            exit 1
          fi

          mkdir -p build/managed-core-release
          python3 scripts/gitops/managed_core_release_publish.py \
            --source-root "${DATA_ROOT}" \
            --source-sha "${SOURCE_SHA}" \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --action "${ACTION}" \
            --dry-run "${DRY_RUN}" \
            --output-dir "${TRUSTED_ROOT}/build/managed-core-release" \
            --outcome-out gitops-outcome.json \
            --evidence-out managed-core-release-evidence.json

          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          echo "### Managed-core release publisher: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            published|dry_run_ok|verify_only_ok) exit 0 ;;
            *) exit 1 ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: managed-core-release-publisher-report
          path: |
            gitops-outcome.json
            managed-core-release-evidence.json
          if-no-files-found: ignore
          retention-days: 30
