name: Content v2.5.2 exact Development repair proof (disposable)

# Branch-specific read-only proof profile at the already registered publisher
# path. It keeps the protected-default workflow untouched and retains the
# existing workflow_dispatch input names/types for API schema compatibility.
# Despite this path's default-branch name, this control version cannot publish.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published issue501 maintenance source commit
        required: true
        type: string
      baseline_sha:
        description: Exact issue501 parent commit
        required: true
        type: string
      baseline_ref:
        description: Exact source issue499 ref containing baseline_sha
        required: true
        type: string
      expected_control_sha:
        description: Exact API-created control commit recorded by root
        required: true
        type: string
      deadline_utc:
        description: Root-issued ISO-8601 UTC expiry, with at least 15 minutes remaining
        required: true
        type: string
      version:
        description: Fixed managed-core package version
        required: false
        type: string
        default: "2.5.2"
      tag:
        description: No release tag is created; fixed compatibility field
        required: false
        type: string
        default: "v2.5.2"
      action:
        description: Only verify-only is allowed in this branch profile
        required: false
        type: choice
        options: [publish, verify-only]
        default: verify-only
      dry_run:
        description: Must be true; no source or release mutation
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: content-development-repair-proof-6f61bce1ba4ee1d6
  cancel-in-progress: false

jobs:
  disposable-repair-proof:
    name: Disposable exact-source installer proof; not consumer acceptance
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'verify-only' &&
      inputs.dry_run == true &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Initialize bounded proof receipt before checkout or helper startup
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/content-policy-proof-evidence
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIRECTORY'])
          root.mkdir(mode=0o700,parents=True,exist_ok=False)
          report={
            'schemaVersion':1,'kind':'content-disposable-same-version-repair-proof',
            'status':'STARTUP','stage':'startup','failureCode':'proof_startup_failed',
            'sourceRepository':'linktrend/IDE-Development',
            'sourceCommit':'6f61bce1ba4ee1d690dc063605387c8842077644',
            'sourceTree':'7f56c2f7ca893848c66c1e61fac43d1f7155a816',
            'targetRepository':'linktrend/LiNKcontent','targetBranch':'development',
            'targetCommit':'1de0143e11583b57017071970ae77aea55fed515',
            'targetTree':'8ad902f75cdf1ea00ab1d5fc1a44228e6f44e808',
            'controlCommit':os.environ['GITHUB_SHA'],'workflowCommit':os.environ['GITHUB_WORKFLOW_SHA'],
            'snapshotSha256Expected':'d1a7da625934b56a11f5a54957e2f18d912527bac9f162f300b68461c9b879bb',
            'repairManifestSha256Expected':'05fd0cb8e79b789c74e9bad812a8e5f62a882356197e7e82b8f49aa7c4eef86f',
            'sourceManifestSha256Expected':'815a6c5de11a8ad7dda27e9f7eaad57dd3f2e37487e68c9492b05a7872aee07f',
            'rawStdoutRetained':False,'rawStderrRetained':False,'liveConsumerChanged':False,
          }
          (root/'report.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          PY

      - name: Checkout exact control commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Reject any different source, baseline, control, or retry
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          DEADLINE_UTC: ${{ inputs.deadline_utc }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, os
          require=lambda ok, code: (_ for _ in ()).throw(SystemExit(code)) if not ok else None
          expected_ref='refs/heads/issue/501-content-first-repair-proof'
          expected_path='linktrend/IDE-Development/.github/workflows/linktrend-managed-core-release-publisher.yml@'+expected_ref
          require(os.environ['GITHUB_REPOSITORY']=='linktrend/IDE-Development','content_proof_repository_rejected')
          require(os.environ['GITHUB_REF']==expected_ref,'content_proof_control_ref_rejected')
          require(os.environ['GITHUB_WORKFLOW_REF']==expected_path,'content_proof_workflow_path_rejected')
          expected_control=os.environ['EXPECTED_CONTROL_SHA']
          require(len(expected_control)==40 and all(c in '0123456789abcdef' for c in expected_control),'content_proof_expected_control_sha_invalid')
          require(os.environ['GITHUB_SHA']==expected_control and os.environ['GITHUB_WORKFLOW_SHA']==expected_control,'content_proof_control_identity_rejected')
          deadline_text=os.environ['DEADLINE_UTC']
          require(deadline_text.endswith('Z'),'content_proof_deadline_not_utc')
          try:
            deadline=dt.datetime.fromisoformat(deadline_text.replace('Z','+00:00'))
          except ValueError:
            raise SystemExit('content_proof_deadline_invalid')
          require(deadline >= dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=15),'content_proof_deadline_margin_rejected')
          require(os.environ['GITHUB_RUN_ATTEMPT']=='1','content_proof_retry_rejected')
          require(os.environ['SOURCE_SHA']=='6f61bce1ba4ee1d690dc063605387c8842077644','content_proof_candidate_sha_rejected')
          require(os.environ['BASELINE_SHA']=='e4ff120ade162dfd1295f19f90793490b5162c62','content_proof_source_parent_rejected')
          require(os.environ['BASELINE_REF']=='refs/heads/issue/499-preserve-content-targeted-repair-scope-and-rollb','content_proof_baseline_ref_rejected')
          require(os.environ['VERSION']=='2.5.2' and os.environ['TAG']=='v2.5.2','content_proof_release_fields_rejected')
          require(os.environ['ACTION']=='verify-only' and os.environ['DRY_RUN'].lower()=='true','content_proof_mutation_mode_rejected')
          require(os.environ['GITHUB_WORKSPACE']=='/home/runner/work/IDE-Development/IDE-Development','content_proof_runner_workspace_rejected')
          PY

      - name: Checkout reviewed source candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6f61bce1ba4ee1d690dc063605387c8842077644
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Run official same-version repair against disposable Development snapshot
        id: proof
        shell: bash
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          DEADLINE_UTC: ${{ inputs.deadline_utc }}
        run: |
          set -euo pipefail
          umask 077
          PRIVATE_OUT="$RUNNER_TEMP/content-proof-stdout.private"
          PRIVATE_ERR="$RUNNER_TEMP/content-proof-stderr.private"
          trap 'rm -f "$PRIVATE_OUT" "$PRIVATE_ERR"' EXIT
          RC=0
          python3 control/.github/controls/content-policy-proof/run-disposable-repair-proof.py \
            --control-root "$GITHUB_WORKSPACE/control/.github/controls/content-policy-proof" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --target-root "$GITHUB_WORKSPACE/content-proof/targets/development" \
            --candidate-sha 6f61bce1ba4ee1d690dc063605387c8842077644 \
            --candidate-tree 7f56c2f7ca893848c66c1e61fac43d1f7155a816 \
            --content-development-sha 1de0143e11583b57017071970ae77aea55fed515 \
            --content-development-tree 8ad902f75cdf1ea00ab1d5fc1a44228e6f44e808 \
            --expected-control-sha "$EXPECTED_CONTROL_SHA" \
            --deadline-utc "$DEADLINE_UTC" \
            --artifact "$GITHUB_WORKSPACE/content-proof/content-repair-payload.zip" \
            --report "$RUNNER_TEMP/content-policy-proof-evidence/report.json" \
            >"$PRIVATE_OUT" 2>"$PRIVATE_ERR" || RC=$?
          exit "$RC"

      - name: Close and bound startup, blocked, or successful proof evidence
        if: always()
        id: evidence
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/content-policy-proof-evidence
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os, pathlib, re
          root=pathlib.Path(os.environ['EVIDENCE_DIRECTORY'])
          root.mkdir(mode=0o700,parents=True,exist_ok=True)
          path=root/'report.json'
          fallback={
            'schemaVersion':1,'kind':'content-disposable-same-version-repair-proof',
            'status':'BLOCKED','stage':'startup','failureCode':'proof_startup_failed',
            'sourceCommit':'6f61bce1ba4ee1d690dc063605387c8842077644',
            'sourceTree':'7f56c2f7ca893848c66c1e61fac43d1f7155a816',
            'targetCommit':'1de0143e11583b57017071970ae77aea55fed515',
            'targetTree':'8ad902f75cdf1ea00ab1d5fc1a44228e6f44e808',
            'controlCommit':os.environ['GITHUB_SHA'],'workflowCommit':os.environ['GITHUB_WORKFLOW_SHA'],
            'rawStdoutRetained':False,'rawStderrRetained':False,'liveConsumerChanged':False,
          }
          success=False
          try:
            contract_path=pathlib.Path('control/.github/controls/content-policy-proof/REPORT-CONTRACT.json')
            contract_bytes=contract_path.read_bytes()
            if hashlib.sha256(contract_bytes).hexdigest() != '6c36a321ff291f9f4ba5650d5f27e675df875b26ab3b2cfb902ba1002460b115':
              raise ValueError('contract')
            contract=json.loads(contract_bytes)
            if path.is_symlink() or not path.is_file() or path.stat().st_size > 32768:
              raise ValueError('report_file')
            value=json.loads(path.read_bytes())
            if not isinstance(value,dict) or set(value)-set(contract['allowedReportKeys']):
              raise ValueError('closed_keys')
            if value.get('schemaVersion') != 1 or value.get('kind') != 'content-disposable-same-version-repair-proof':
              raise ValueError('identity')
            if value.get('status') not in contract['statuses'] or value.get('stage') not in contract['stages']:
              raise ValueError('enum')
            if 'failureCode' in value and value['failureCode'] not in contract['failureCodes']:
              raise ValueError('failure_code')
            for key,item in value.items():
              if type(item) not in (str,bool,int,float) or (isinstance(item,str) and len(item)>512):
                raise ValueError('scalar')
              if type(item) is float and (not math.isfinite(item) or not 0 <= item <= 900):
                raise ValueError('number')
            for key in ('rawStdoutRetained','rawStderrRetained','liveConsumerChanged'):
              if value.get(key) is not False: raise ValueError('scope')
            for key in ('sourceCommit','sourceTree','targetCommit','targetTree','controlCommit','workflowCommit'):
              if not isinstance(value.get(key),str) or not re.fullmatch('[0-9a-f]{40}',value[key]):
                raise ValueError('oid')
            if value['status']=='STARTUP' or (value['status']=='blocked' and 'failureCode' not in value):
              value['status']='BLOCKED'
              value['failureCode']='proof_startup_failed'
            success=(os.environ['PROOF_OUTCOME']=='success' and value['status']=='PASS_DISPOSABLE_ONLY'
              and value.get('stage')=='complete' and 'failureCode' not in value
              and value.get('replacedManagedPathCount')==20 and value.get('changedGitPathCount')==22)
            if value['status']=='PASS_DISPOSABLE_ONLY' and not success:
              raise ValueError('success_mismatch')
          except Exception:
            value=fallback
          encoded=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
          if len(encoded)>32768:
            value=fallback
            encoded=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
            success=False
          if path.is_symlink(): path.unlink()
          path.write_bytes(encoded)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('payload_allowed='+('true' if success else 'false')+'\n')
          print(json.dumps({key:value[key] for key in ('status','stage','failureCode') if key in value},sort_keys=True))
          if not success: raise SystemExit(1)
          PY

      - name: Retain only the bounded closed proof report on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-development-disposable-repair-report
          path: ${{ runner.temp }}/content-policy-proof-evidence/report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the exact repaired Development payload after a successful proof
        if: steps.proof.outcome == 'success' && steps.evidence.outputs.payload_allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-development-disposable-repair-payload
          path: content-proof/content-repair-payload.zip
          if-no-files-found: error
          retention-days: 7
