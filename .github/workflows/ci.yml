name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify IDE Development
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history keeps the runtime-supplied target baseline reachable.
          fetch-depth: 0

      - name: Ensure runtime target ref
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          target_ref="origin/${GITHUB_BASE_REF}"
          if git rev-parse --verify "${target_ref}^{commit}" >/dev/null 2>&1; then
            echo "${target_ref} already present"
            exit 0
          fi
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git rev-parse --verify "${target_ref}^{commit}"

      - name: Candidate finalization against runtime target baseline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          baseline_ref="origin/${GITHUB_BASE_REF}"
          baseline_sha="${{ github.event.pull_request.base.sha }}"
          python3 scripts/gitops/generated_output_closure.py \
            --finalize --baseline-sha "${baseline_sha}" --baseline-ref "${baseline_ref}"

      - name: Inject exact runtime baseline into Stage 1 receipt context
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            baseline_ref="origin/${GITHUB_BASE_REF}"
            baseline_sha="${{ github.event.pull_request.base.sha }}"
          else
            baseline_sha="${{ github.event.before }}"
            baseline_ref="$(python3 scripts/gitops/generated_output_closure.py \
              --bind-push-baseline \
              --push-branch "${GITHUB_REF_NAME}" \
              --push-before "${baseline_sha}" \
              --push-after "${{ github.event.after }}" | jq -r .baselineRef)"
          fi
          printf 'LINKTREND_TARGET_BASELINE_REF=%s\n' "${baseline_ref}" >> "${GITHUB_ENV}"
          printf 'LINKTREND_TARGET_BASELINE_SHA=%s\n' "${baseline_sha}" >> "${GITHUB_ENV}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install CI Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0"

      - name: Stage 1 verification
        # Runs verify-ide-development.sh, which also invokes:
        #   scripts/verify-vendored-skills.sh
        #   scripts/test-gate-stop-progression.sh
        #   scripts/feasibility/run-fixed-pipeline-feasibility.sh
        # Skipped in CI (not runnable / side-effecting):
        #   scripts/wire-repo.sh — needs a consumer repo path
        #   scripts/install-git-hooks.sh — mutates local git config
        # Local-only archive directory checks are skipped when CI=true.
        env:
          CI: "true"
        run: bash scripts/verify-ide-development.sh

      - name: Pipeline state consistency (hooks equivalent)
        # Same fail-closed check as .githooks/pre-commit and .githooks/pre-push,
        # so invalid PIPELINE-STATE.json cannot land even if local hooks are bypassed.
        run: bash scripts/verify-pipeline-states.sh
