name: CI

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: startsWith(github.head_ref, 'phase/')
    # Required status check on the development ruleset; the name is fixed.
    name: Linktrend Fast Checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install CI Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0"

      - name: Fast profile
        # Same command runs locally: python3 scripts/gitops/run_delivery_profile.py fast
        run: python3 scripts/gitops/run_delivery_profile.py fast

  verify:
    if: startsWith(github.head_ref, 'phase/')
    name: Verify IDE Development
    runs-on: ubuntu-24.04-arm
    # Bound the existing combined Verify suite before writing its reusable evidence.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure runtime target ref
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          target_ref="origin/${GITHUB_BASE_REF}"
          if git rev-parse --verify "${target_ref}^{commit}" >/dev/null 2>&1; then
            echo "${target_ref} already present"
            exit 0
          fi
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git rev-parse --verify "${target_ref}^{commit}"

      - name: Export runtime target baseline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          printf 'LINKTREND_TARGET_BASELINE_REF=%s\n' "origin/${GITHUB_BASE_REF}" >> "${GITHUB_ENV}"
          printf 'LINKTREND_TARGET_BASELINE_SHA=%s\n' "${{ github.event.pull_request.base.sha }}" >> "${GITHUB_ENV}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install CI Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0"

      - name: Run combined Phase verification and write exact identity inventory
        env:
          CI: "true"
        run: >-
          python3 scripts/gitops/run_delivery_profile.py full
          --inventory-json full-suite-inventory.json

      - name: Upload exact Full suite inventory
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ide-full-suite-inventory
          path: full-suite-inventory.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
