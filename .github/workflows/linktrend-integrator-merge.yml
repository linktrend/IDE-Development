name: LiNKtrend Integrator Merge To Development

# Privileged jobs checkout the default branch only (never PR head/merge).
# Wake paths: pull_request_target (initial), workflow_run (every Actions gate
# workflow that produces a named fast-gate check), check_run (external apps).
#
# Consumers: workflow_run.workflows is STATIC YAML — list every gate-producing
# workflow display name for the repository (IDE: CI + Branch Source Policy).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
  workflow_run:
    workflows:
      - CI
      - Branch Source Policy
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to evaluate"
        required: false
        type: string

permissions: {}

concurrency:
  group: integrator-pr-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.check_run.id || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug != 'github-actions' &&
       github.event.check_run.name != 'evaluate' &&
       github.event.check_run.name != 'Linktrend Integrator Result' &&
       github.event.check_run.name != 'Linktrend Packager Result' &&
       github.event.check_run.name != 'Linktrend Staging Outcome' &&
       github.event.check_run.name != 'Linktrend Main Outcome' &&
       github.event.check_run.name != 'enable-auto-merge' &&
       github.event.check_run.name != 'merge-when-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Resolve PR/head from trusted event fields
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "pr=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t _lines < <(python3 scripts/gitops/resolve_event_pr.py)
          PR=""
          HEAD=""
          for line in "${_lines[@]}"; do
            case "$line" in
              pr=*) PR="${line#pr=}" ;;
              head=*) HEAD="${line#head=}" ;;
            esac
          done
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD}" >> "$GITHUB_OUTPUT"

      - name: Evaluate and maybe merge
        env:
          LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          REQUIRED_CHECKS: ${{ vars.LINKTREND_INTEGRATOR_REQUIRED_CHECKS || 'Verify IDE Development,Enforce allowed PR source branches' }}
          BUGBOT_SUCCESS_CHECK_NAME: Cursor Bugbot
          GATE_WAIT_SECONDS: "120"
          GATE_POLL_SECONDS: "15"
          REQUIRE_APP_TOKEN: "1"
        run: |
          set -euo pipefail
          if ! source scripts/gitops/resolve_automation_token.sh; then
            GITHUB_TOKEN="${{ github.token }}" python3 scripts/gitops/write_outcome.py \
              --file integrator-result.json \
              --status automation_credentials_blocked \
              --detail "Integrator requires GitHub App token for autonomous merge" \
              --check-name "Linktrend Integrator Result" \
              --head-sha "${HEAD_SHA}" \
              --token-env GITHUB_TOKEN
            cp integrator-result.json gitops-outcome.json
            echo "### Integrator status: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export AUTOMATION_TOKEN AUTOMATION_TOKEN_SOURCE
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          bash scripts/gitops/integrator_evaluate.sh

      - name: Upload integrator result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrator-result
          path: |
            integrator-result.json
            gitops-outcome.json
          if-no-files-found: ignore

      - name: Summarize honest status
        if: always()
        run: |
          set -euo pipefail
          f=""
          if [ -f integrator-result.json ]; then f=integrator-result.json
          elif [ -f gitops-outcome.json ]; then f=gitops-outcome.json
          fi
          if [ -n "$f" ]; then
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$f")"
            detail="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("detail",""))' "$f")"
            echo "### Integrator status: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
            case "${status}" in
              failed|automation_credentials_blocked) exit 1 ;;
              *) exit 0 ;;
            esac
          else
            echo "missing outcome file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
