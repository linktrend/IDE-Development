name: LiNKtrend Integrator Merge To Development

# Evaluate/merge PRs into development using named fast-gate + Cursor Bugbot +
# reviewed SHA marker. Emits honest integrator-result.json and check run
# "Linktrend Integrator Result" (success only when merged).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to evaluate"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: integrator-pr-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name != 'evaluate' &&
       github.event.check_run.name != 'Linktrend Integrator Result' &&
       github.event.check_run.name != 'enable-auto-merge' &&
       github.event.check_run.name != 'merge-when-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Evaluate and maybe merge
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.check_run.head_sha || github.event.pull_request.head.sha || '' }}
          REQUIRED_CHECKS: ${{ vars.LINKTREND_INTEGRATOR_REQUIRED_CHECKS || 'Verify IDE Development' }}
          BUGBOT_SUCCESS_CHECK_NAME: Cursor Bugbot
          GATE_WAIT_SECONDS: "900"
          GATE_POLL_SECONDS: "20"
        run: bash scripts/gitops/integrator_evaluate.sh

      - name: Upload integrator result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrator-result
          path: integrator-result.json
          if-no-files-found: ignore

      - name: Summarize honest status
        if: always()
        run: |
          set -euo pipefail
          if [ -f integrator-result.json ]; then
            status="$(python3 -c 'import json; print(json.load(open("integrator-result.json"))["status"])')"
            detail="$(python3 -c 'import json; print(json.load(open("integrator-result.json"))["detail"])')"
            echo "### Integrator status: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
            # Fail the job for blocked/failed so a green "evaluate" check never
            # implies a merge that did not happen. waiting/merged exit 0.
            case "${status}" in
              blocked|failed) exit 1 ;;
              *) exit 0 ;;
            esac
          else
            echo "### Integrator status: \`failed\`" >> "$GITHUB_STEP_SUMMARY"
            echo "missing integrator-result.json" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
