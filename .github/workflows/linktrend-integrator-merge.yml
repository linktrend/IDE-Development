name: LiNKtrend Integrator Merge To Development

# Merge-only Integrator for PRs into development.
#
# Pass gate (authoritative — matches Cursor Bugbot docs):
#   - Check named exactly "Cursor Bugbot" reports SUCCESS
#     (success = no open Bugbot findings; NEUTRAL = findings remain → do not merge)
#   - No failing/cancelled/pending non-integrator checks on the PR
#
# Bugbot posts COMMENTED reviews and does not GitHub-APPROVE. Do not wait for
# review.state == approved. Prefer a development ruleset that requires the
# "Cursor Bugbot" check (see scripts/apply-development-merge-ruleset.sh).
#
# This job polls until gates pass (or timeout). pull_request fires before Bugbot
# finishes; check_run on the default branch may lag until this workflow is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to evaluate"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: integrator-${{ github.event.pull_request.number || github.event.check_run.head_sha || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  integrate:
    name: integrate
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name != 'integrate' &&
       github.event.check_run.name != 'enable-auto-merge' &&
       github.event.check_run.name != 'merge-when-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Merge when CI green and Bugbot success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          HEAD_SHA: ${{ github.event.check_run.head_sha || github.event.pull_request.head.sha || '' }}
          # Bugbot often takes 1–3 minutes; allow headroom for CI + review.
          GATE_WAIT_SECONDS: "900"
          GATE_POLL_SECONDS: "20"
        run: |
          set -euo pipefail

          collect_prs() {
            if [ -n "${PR_NUMBER}" ]; then
              printf '%s\n' "${PR_NUMBER}"
            elif [ -n "${HEAD_SHA}" ]; then
              gh pr list --base development --state open \
                --json number,isDraft,headRefOid \
                --jq ".[] | select(.isDraft==false and .headRefOid==\"${HEAD_SHA}\") | .number"
            else
              gh pr list --base development --state open \
                --json number,isDraft \
                --jq '.[] | select(.isDraft==false) | .number'
            fi
          }

          gates_pass() {
            local pr="$1"
            local meta checks bugbot_state failing pending

            meta="$(gh pr view "${pr}" --json baseRefName,isDraft,state,headRefOid)"
            if ! echo "${meta}" | jq -e '.baseRefName=="development" and .isDraft==false and .state=="OPEN"' >/dev/null; then
              echo "PR #${pr}: not an open non-draft PR into development"
              return 1
            fi

            checks="$(gh pr checks "${pr}" --json name,state 2>/dev/null || echo '[]')"

            # Require every Cursor Bugbot row to be SUCCESS so a stale success cannot
            # mask a newer NEUTRAL/FAILURE on the same head.
            bugbot_state="$(
              echo "${checks}" | jq -r '
                [.[] | select(.name=="Cursor Bugbot")] as $b
                | if ($b|length)==0 then "missing"
                  elif any($b[]; .state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS") then "pending"
                  elif all($b[]; .state=="SUCCESS") then "success"
                  else "not_success"
                  end'
            )"

            if [ "${bugbot_state}" != "success" ]; then
              echo "PR #${pr}: Bugbot gate not passed (state=${bugbot_state})"
              return 1
            fi

            failing="$(
              echo "${checks}" | jq -r '
                [.[]
                  | select(.name!="integrate"
                      and .name!="enable-auto-merge"
                      and .name!="merge-when-ready"
                      and .name!="Cursor Bugbot Autofix")
                  | select(.state=="FAILURE" or .state=="CANCELLED"
                      or .state=="TIMED_OUT" or .state=="ACTION_REQUIRED"
                      or .state=="ERROR")
                  | .name]
                | unique | .[]'
            )"
            if [ -n "${failing}" ]; then
              echo "PR #${pr}: failing checks:"
              printf '%s\n' "${failing}"
              return 1
            fi

            pending="$(
              echo "${checks}" | jq -r '
                [.[]
                  | select(.name!="integrate"
                      and .name!="enable-auto-merge"
                      and .name!="merge-when-ready"
                      and .name!="Cursor Bugbot Autofix"
                      and .name!="Cursor Bugbot")
                  | select(.state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS")
                  | .name]
                | unique | .[]'
            )"
            if [ -n "${pending}" ]; then
              echo "PR #${pr}: checks still pending:"
              printf '%s\n' "${pending}"
              return 1
            fi

            echo "PR #${pr}: gates passed (Bugbot success + checks green)"
            return 0
          }

          try_merge() {
            local pr="$1"
            # Merge only after gates pass. Do not arm --auto before Bugbot success
            # when no ruleset is present (that would merge too early).
            if gh pr merge "${pr}" --squash --auto; then
              echo "PR #${pr}: auto-merge armed or completed"
              return 0
            elif gh pr merge "${pr}" --squash; then
              echo "PR #${pr}: merged"
              return 0
            fi
            echo "PR #${pr}: merge attempt failed (policy/conflict) — not force-merging"
            return 1
          }

          echo "Event=${EVENT_NAME} PR_NUMBER=${PR_NUMBER:-none} HEAD_SHA=${HEAD_SHA:-none}"

          mapfile -t prs < <(collect_prs)
          if [ "${#prs[@]}" -eq 0 ] || [ -z "${prs[0]:-}" ]; then
            echo "No candidate development PRs to evaluate."
            exit 0
          fi

          deadline=$((SECONDS + GATE_WAIT_SECONDS))
          for pr in "${prs[@]}"; do
            [ -n "${pr}" ] || continue
            echo "Evaluating PR #${pr} (wait up to ${GATE_WAIT_SECONDS}s)"
            merged=0
            while true; do
              if gates_pass "${pr}"; then
                if try_merge "${pr}"; then
                  merged=1
                fi
                break
              fi
              # Permanent Bugbot failure/neutral: do not spin the full timeout.
              checks_now="$(gh pr checks "${pr}" --json name,state 2>/dev/null || echo '[]')"
              bugbot_now="$(
                echo "${checks_now}" | jq -r '
                  [.[] | select(.name=="Cursor Bugbot")] as $b
                  | if ($b|length)==0 then "missing"
                    elif any($b[]; .state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS") then "pending"
                    elif all($b[]; .state=="SUCCESS") then "success"
                    else "not_success"
                    end'
              )"
              if [ "${bugbot_now}" = "not_success" ]; then
                echo "PR #${pr}: Bugbot not clear (state=${bugbot_now}) — leaving open for Fix agent"
                break
              fi
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "PR #${pr}: timed out waiting for gates — leaving open"
                break
              fi
              echo "PR #${pr}: waiting ${GATE_POLL_SECONDS}s for gates..."
              sleep "${GATE_POLL_SECONDS}"
            done
            if [ "${merged}" -eq 0 ]; then
              echo "PR #${pr}: not merged this run"
            fi
          done
