# Review Packager — draft PR → fast-gate → ready → Bugbot once

name: Linktrend Review Packager

on:
  schedule:
    # Tuesday and Friday 08:00 Asia/Taipei (= 00:00 UTC)
    - cron: "0 0 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this packaging run is needed"
        required: false
        default: "manual"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: linktrend-review-packager-${{ github.repository }}
  cancel-in-progress: false

env:
  # Prefer repo variable; exact default is "cursor review" (no @).
  BUGBOT_REVIEW_COMMAND: ${{ vars.LINKTREND_BUGBOT_REVIEW_COMMAND || 'cursor review' }}
  FAST_GATE_CHECKS: ${{ vars.LINKTREND_INTEGRATOR_REQUIRED_CHECKS || 'Verify IDE Development' }}
  GATE_WAIT_SECONDS: "900"
  GATE_POLL_SECONDS: "20"

jobs:
  package:
    name: Package review-ready work branches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run packager
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python3 scripts/gitops/packager_runner.py

      - name: Upload packager report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-packager-report
          path: packager-report.json
          if-no-files-found: ignore
