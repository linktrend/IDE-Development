# Review Packager — discover review-ready work, open PRs, request Bugbot once

name: Linktrend Review Packager

on:
  schedule:
    # Tuesday and Friday 08:00 Asia/Taipei (= 00:00 UTC)
    - cron: "0 0 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this urgent packaging run is needed"
        required: false
        default: "manual"
      force_repo_scan:
        description: "If true, scan even when no local trigger (always true for this workflow)"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: linktrend-review-packager-${{ github.repository }}
  cancel-in-progress: false

env:
  # Configurable Bugbot mention-only command. Default is Cursor's documented form.
  # Do not add @ unless live testing proves this installation requires it.
  BUGBOT_REVIEW_COMMAND: "cursor review"
  BUGBOT_SUCCESS_CHECK_NAME: "Cursor Bugbot"
  REVIEW_READY_PATH: ".linktrend/review-ready.json"
  BUGBOT_MARKER_PREFIX: "<!-- linktrend-bugbot-requested:"
  TIMEZONE_LABEL: "Asia/Taipei"
  SHIP_HOUR_LABEL: "Ship 05"
  PULL_HOUR_LABEL: "Pull 07"

jobs:
  package:
    name: Package review-ready issue branches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout default branch tip for tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve development SHA
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEV_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/development" --jq .object.sha)"
          echo "development_sha=${DEV_SHA}" >> "${GITHUB_OUTPUT}"
          echo "development SHA: ${DEV_SHA}"

      - name: Discover review-ready branches
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          ready_path = os.environ["REVIEW_READY_PATH"]
          out = Path(os.environ["GITHUB_WORKSPACE"]) / "packager-candidates.json"

          def gh_api(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "linktrend-review-packager",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          branches = []
          page = 1
          while True:
              chunk = gh_api(f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}")
              if not chunk:
                  break
              branches.extend(chunk)
              if len(chunk) < 100:
                  break
              page += 1

          candidates = []
          for b in branches:
              name = b.get("name") or ""
              if not name.startswith("issue/"):
                  continue
              sha = (b.get("commit") or {}).get("sha")
              if not sha:
                  continue
              # Fetch review-ready.json at branch tip
              try:
                  content = subprocess.check_output(
                      [
                          "gh", "api",
                          f"repos/{repo}/contents/{ready_path}?ref={name}",
                          "--jq", ".content",
                      ],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except subprocess.CalledProcessError:
                  continue
              if not content or content == "null":
                  continue
              import base64
              raw = base64.b64decode(content.replace("\n", "")).decode("utf-8")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  candidates.append({"branch": name, "headSha": sha, "status": "invalid_json", "reason": "review-ready.json not valid JSON"})
                  continue
              marked = (data.get("commitSha") or "").strip().lower()
              if marked != sha.lower():
                  candidates.append({
                      "branch": name,
                      "headSha": sha,
                      "markedSha": marked,
                      "status": "stale",
                      "reason": f"review-ready commitSha {marked} != HEAD {sha}",
                  })
                  continue
              candidates.append({
                  "branch": name,
                  "headSha": sha,
                  "markedSha": marked,
                  "status": "eligible",
                  "issueId": data.get("issueId") or data.get("issueKey") or "",
                  "summary": data.get("summary") or data.get("notes") or "",
              })

          out.write_text(json.dumps(candidates, indent=2) + "\n", encoding="utf-8")
          eligible = [c for c in candidates if c["status"] == "eligible"]
          print(f"candidates={len(candidates)} eligible={len(eligible)}")
          for c in candidates:
              print(f"  {c['status']}: {c['branch']} ({c.get('reason','ok')})")
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"eligible_count={len(eligible)}\n"
          )
          PY

      - name: Open or refresh PRs and request Bugbot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, urllib.error, urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          cmd = os.environ["BUGBOT_REVIEW_COMMAND"].strip()
          marker_prefix = os.environ["BUGBOT_MARKER_PREFIX"]
          candidates = json.loads(Path("packager-candidates.json").read_text(encoding="utf-8"))
          report = []

          def gh_json(method: str, url: str, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "linktrend-review-packager",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} -> {e.code}: {detail}") from e

          def run(args: list[str]) -> str:
              return subprocess.check_output(args, text=True).strip()

          def list_open_prs(head_branch: str):
              q = f"repo:{repo} is:pr is:open head:{head_branch} base:development"
              out = run(["gh", "pr", "list", "--search", q, "--json", "number,url,isDraft,headRefOid,body,comments"])
              return json.loads(out or "[]")

          def marker_for(sha: str) -> str:
              return f"{marker_prefix} {sha.lower()} -->"

          def body_has_marker(body: str, sha: str) -> bool:
              return marker_for(sha) in (body or "")

          def count_bugbot_requests(pr_number: int, sha: str) -> int:
              """Count prior Bugbot request comments for this SHA (marker or command)."""
              comments = gh_json("GET", f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=100")
              n = 0
              needle = marker_for(sha)
              for c in comments:
                  body = c.get("body") or ""
                  if needle in body:
                      n += 1
                  elif re.search(r"(?im)^\s*cursor\s+review\s*$", body) or re.search(r"(?im)^\s*@?cursor\s+bugbot\b", body):
                      # legacy / alternate forms without marker — count cautiously
                      if sha.lower()[:7] in body.lower() or needle.split()[-2] in body:
                          n += 1
              return n

          def ensure_pr(branch: str, sha: str, summary: str) -> dict:
              existing = json.loads(run([
                  "gh", "pr", "list",
                  "--head", branch,
                  "--base", "development",
                  "--state", "open",
                  "--json", "number,url,isDraft,headRefOid,body,title",
              ]) or "[]")
              title = f"Review: {branch}"
              if summary:
                  title = summary[:72] if len(summary) <= 72 else summary[:69] + "..."
              marker = marker_for(sha)
              base_body = (
                  f"## Review Packager\n\n"
                  f"Automated packaging for review-ready branch `{branch}`.\n\n"
                  f"- Reviewed candidate SHA: `{sha}`\n"
                  f"- Schedule: Tuesday/Friday 08:00 {os.environ.get('TIMEZONE_LABEL','Asia/Taipei')} "
                  f"(after {os.environ.get('PULL_HOUR_LABEL','Pull 07')})\n\n"
                  f"### Freeze\n"
                  f"Do not push new commits to this branch while this SHA is under review. "
                  f"Continue work on another issue branch or worktree.\n\n"
                  f"{marker}\n"
              )
              if existing:
                  pr = existing[0]
                  # Ensure ready for review
                  if pr.get("isDraft"):
                      run(["gh", "pr", "ready", str(pr["number"])])
                  # Refresh body marker if missing for this SHA
                  body = pr.get("body") or ""
                  if not body_has_marker(body, sha):
                      # Replace old markers for other SHAs
                      new_body = re.sub(
                          r"<!-- linktrend-bugbot-requested:\s*[0-9a-fA-F]+ -->",
                          "",
                          body,
                      ).rstrip() + "\n\n" + marker + "\n"
                      if "Review Packager" not in new_body:
                          new_body = base_body
                      run(["gh", "pr", "edit", str(pr["number"]), "--body", new_body])
                      body = new_body
                  return {"number": pr["number"], "url": pr["url"], "body": body, "created": False}
              # Create ready (non-draft) PR
              url = run([
                  "gh", "pr", "create",
                  "--base", "development",
                  "--head", branch,
                  "--title", title,
                  "--body", base_body,
              ])
              num = run(["gh", "pr", "view", url, "--json", "number", "--jq", ".number"])
              return {"number": int(num), "url": url, "body": base_body, "created": True}

          def request_bugbot(pr_number: int, sha: str, body: str) -> str:
              # Idempotent: skip if marker already present for this SHA AND a request was posted
              comments = gh_json("GET", f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=100")
              needle = marker_for(sha)
              for c in comments:
                  b = c.get("body") or ""
                  if needle in b and cmd in b:
                      return "skipped_duplicate_marker"
              # Normal max: 1 initial + 1 after consolidated correction batch
              prior = 0
              for c in comments:
                  b = c.get("body") or ""
                  if "linktrend-bugbot-requested:" in b or re.search(r"(?im)^\s*cursor\s+review\s*$", b):
                      prior += 1
              if prior >= 2:
                  return "skipped_max_requests"
              comment = f"{cmd}\n\n{needle}\n"
              gh_json(
                  "POST",
                  f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
                  {"body": comment},
              )
              return "requested"

          for c in candidates:
              entry = dict(c)
              if c["status"] != "eligible":
                  entry["action"] = "skipped"
                  report.append(entry)
                  continue
              branch = c["branch"]
              sha = c["headSha"]
              try:
                  # Skip if PR already merged etc.
                  pr = ensure_pr(branch, sha, c.get("summary") or "")
                  # Head must still match
                  head = run(["gh", "pr", "view", str(pr["number"]), "--json", "headRefOid", "--jq", ".headRefOid"])
                  if head.lower() != sha.lower():
                      entry["action"] = "skipped_head_drift"
                      entry["reason"] = f"PR head {head} != review-ready {sha}"
                      report.append(entry)
                      continue
                  result = request_bugbot(pr["number"], sha, pr.get("body") or "")
                  entry["action"] = result
                  entry["pr"] = pr["number"]
                  entry["pr_url"] = pr["url"]
                  # Freeze notice comment once
                  if result == "requested" or pr.get("created"):
                      gh_json(
                          "POST",
                          f"https://api.github.com/repos/{repo}/issues/{pr['number']}/comments",
                          {
                              "body": (
                                  f"## Review freeze\n\n"
                                  f"Branch `{branch}` is frozen at `{sha}` for review.\n"
                                  f"Continue only on another issue branch or worktree. "
                                  f"A new functional commit invalidates this reviewed SHA.\n"
                              )
                          },
                      )
              except Exception as e:
                  entry["action"] = "error"
                  entry["reason"] = str(e)
              report.append(entry)

          Path("packager-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload packager report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-packager-report
          path: |
            packager-candidates.json
            packager-report.json
          if-no-files-found: ignore
