# Review Packager — discovery + evaluate
# Privileged jobs ALWAYS checkout the repository default branch for scripts.
# Never execute PR head/merge code with write credentials.
#
# Wake paths:
#   - schedule / workflow_dispatch → discover (draft PRs only)
#   - pull_request_target → initial evaluate (trusted workflow + scripts)
#   - workflow_run → Actions gate completion for EVERY workflow that produces a
#     named fast-gate check (IDE: CI + Branch Source Policy). check_run alone is
#     insufficient for Actions-created suites.
#   - check_run → external apps only (e.g. Cursor Bugbot); github-actions filtered out
#
# Consumers: workflow_run.workflows is STATIC YAML. Substitute/generate the list of
# every workflow display name that produces a configured named gate check. Repository
# variables cannot change workflow_run trigger names.

name: Linktrend Review Packager

on:
  schedule:
    - cron: "0 0 * * 2,5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this packaging run is needed"
        required: false
        default: "manual"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development]
  workflow_run:
    workflows:
      - CI
      - Branch Source Policy
    types: [completed]
  check_run:
    types: [completed]

permissions: {}

# Serialize evaluate for the same PR/head across pull_request_target, workflow_run,
# and check_run. Never use workflow_run.id / check_run.id (those split the group).
# cancel-in-progress=false: queue, do not interrupt; second run rereads comments.
concurrency:
  group: linktrend-packager-eval-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_run.head_sha || format('misc-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  BUGBOT_REVIEW_COMMAND: ${{ vars.LINKTREND_BUGBOT_REVIEW_COMMAND || 'cursor review' }}
  FAST_GATE_CHECKS: ${{ vars.LINKTREND_INTEGRATOR_REQUIRED_CHECKS || 'Verify IDE Development,Enforce allowed PR source branches' }}

jobs:
  discover:
    name: Discover ready tips (draft PRs only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Private key only here. Consuming steps must not receive it.
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Discover
        env:
          LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_APP_TOKEN: "1"
        run: |
          set -euo pipefail
          if ! source scripts/gitops/resolve_automation_token.sh; then
            python3 scripts/gitops/write_outcome.py \
              --status automation_credentials_blocked \
              --detail "App token unavailable for Packager discover"
            echo "### Packager discover: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # App token for all autonomous API calls (including readiness). Never use workflow GITHUB_TOKEN.
          export AUTOMATION_TOKEN AUTOMATION_TOKEN_SOURCE AUTOMATION_CREDENTIALS_STATUS
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          python3 scripts/gitops/packager_discover.py
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          echo "### Packager discover: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-discover-report
          path: |
            packager-discover-report.json
            gitops-outcome.json
          if-no-files-found: ignore

  evaluate:
    name: Evaluate draft PR after gates
    # Filter BEFORE checkout/token mint. Only development PRs; never promote/*;
    # never push CI without a PR; never outcome-check self-wakes.
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'development' &&
        !startsWith(github.head_ref, 'promote/')
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target') &&
        !startsWith(github.event.workflow_run.head_branch, 'promote/') &&
        (
          github.event.workflow_run.pull_requests[0] == null ||
          github.event.workflow_run.pull_requests[0].base.ref == 'development'
        )
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug != 'github-actions' &&
        github.event.check_run.name != 'Linktrend Packager Result' &&
        github.event.check_run.name != 'Linktrend Integrator Result' &&
        github.event.check_run.name != 'Linktrend Staging Outcome' &&
        github.event.check_run.name != 'Linktrend Main Outcome' &&
        github.event.check_run.name != 'evaluate' &&
        github.event.check_run.pull_requests[0].base.ref == 'development' &&
        !startsWith(github.event.check_run.pull_requests[0].head.ref, 'promote/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        continue-on-error: true
        with:
          app-id: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          private-key: ${{ secrets.LINKTREND_GITOPS_APP_PRIVATE_KEY }}

      - name: Resolve PR/head from trusted event fields
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t _lines < <(python3 scripts/gitops/resolve_event_pr.py)
          PR=""
          HEAD=""
          for line in "${_lines[@]}"; do
            case "$line" in
              pr=*) PR="${line#pr=}" ;;
              head=*) HEAD="${line#head=}" ;;
            esac
          done
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD}" >> "$GITHUB_OUTPUT"

      - name: Evaluate one PR
        env:
          LINKTREND_GITOPS_APP_ID: ${{ vars.LINKTREND_GITOPS_APP_ID }}
          LINKTREND_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BUGBOT_REVIEW_COMMAND: ${{ env.BUGBOT_REVIEW_COMMAND }}
          FAST_GATE_CHECKS: ${{ env.FAST_GATE_CHECKS }}
          REQUIRE_APP_TOKEN: "1"
        run: |
          set -euo pipefail
          if ! source scripts/gitops/resolve_automation_token.sh; then
            # Result check may use the job token (not autonomous mutation).
            GITHUB_TOKEN="${{ github.token }}" python3 scripts/gitops/write_outcome.py \
              --status automation_credentials_blocked \
              --detail "App token unavailable for Packager evaluate" \
              --check-name "Linktrend Packager Result" \
              --head-sha "${HEAD_SHA}" \
              --token-env GITHUB_TOKEN
            echo "### Packager evaluate: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export AUTOMATION_TOKEN AUTOMATION_TOKEN_SOURCE AUTOMATION_CREDENTIALS_STATUS
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          python3 scripts/gitops/packager_evaluate.py
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          detail="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json")).get("detail",""))')"
          echo "### Packager evaluate: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packager-evaluate-report
          path: |
            packager-evaluate-report.json
            gitops-outcome.json
          if-no-files-found: ignore
