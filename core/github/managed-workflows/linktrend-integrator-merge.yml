name: Linktrend Full Suite

# Full validation is an explicit seal-bound dispatch.  It never wakes from a
# checkpoint push or from opening a draft PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact Phase PR number
        required: true
        type: string
      source_branch:
        description: Exact Phase source branch
        required: true
        type: string
      head_sha:
        description: Exact sealed Phase head SHA
        required: true
        type: string
      candidate_id:
        description: Exact derived candidate ID from the seal
        required: true
        type: string
      seal_revision:
        description: Sealed candidate revision, 1 or 2
        required: true
        type: string
      attempt:
        description: Infrastructure attempt for this exact candidate, 1 or 2
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ inputs.pr_number }}|head-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  full:
    name: Linktrend Full Suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      EXPECTED_HEAD: ${{ inputs.head_sha }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      SEAL_REVISION: ${{ inputs.seal_revision }}
      ATTEMPT: ${{ inputs.attempt }}
    steps:
      - name: Capture start time
        id: clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact sealed Phase head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate live head and exact seal
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${SEAL_REVISION}" | grep -Eq '^[12]$' || {
            echo "invalid_seal_revision=${SEAL_REVISION}"; exit 1;
          }
          printf '%s' "${ATTEMPT}" | grep -Eq '^[12]$' || {
            echo "full_suite_attempt_limit: ${ATTEMPT}"; exit 1;
          }
          case "${SOURCE_BRANCH}" in
            phase/*) ;;
            *) echo "full_suite_requires_phase_branch=${SOURCE_BRANCH}"; exit 1 ;;
          esac
          case "${CANDIDATE_ID}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "invalid_candidate_id"; exit 1 ;;
          esac
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_HEAD}" || {
            echo "full_suite_head_mismatch: expected=${EXPECTED_HEAD} actual=${actual}"; exit 1;
          }
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "${live}" = "${EXPECTED_HEAD}" || {
            echo "full_suite_stale_seal: expected=${EXPECTED_HEAD} live=${live}"; exit 1;
          }
          python3 - "${EXPECTED_HEAD}" "${CANDIDATE_ID}" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected_head, expected_candidate = sys.argv[1:]
          path = Path(".linktrend/phase-delivery-record.json")
          if not path.is_file():
              raise SystemExit("sealed_phase_record_missing")
          record = json.loads(path.read_text(encoding="utf-8"))
          identity = record.get("candidateIdentity") or {}
          if record.get("sealed") is not True or record.get("sealedSha") != expected_head:
              raise SystemExit("sealed_phase_record_mismatch")
          if identity.get("sourceSha") != expected_head:
              raise SystemExit("sealed_candidate_head_mismatch")
          record_candidate = str(record.get("candidateId") or "")
          if record_candidate and record_candidate != expected_candidate:
              raise SystemExit("sealed_candidate_id_mismatch")
          if not expected_candidate.startswith("sha256:"):
              raise SystemExit("candidate_id_missing")
          print("exact sealed candidate accepted")
          PY

      - name: Run full profile
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest \
            scripts.tests.test_candidate_lifecycle \
            scripts.tests.test_gate_receipts \
            scripts.tests.test_promotion_receipt_gate \
            scripts.tests.test_phase_batch_lifecycle
          bash scripts/tests/test-gitops-phase-delivery.sh

      - name: Write exact full-suite receipt
        if: success()
        working-directory: candidate
        env:
          STARTED: ${{ steps.clock.outputs.started_at }}
        run: |
          set -euo pipefail
          COMPLETED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "${STARTED}" "${COMPLETED}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.gitops.coordinator.receipts import (
              canonical_digest,
              compute_candidate_identity,
              write_receipt,
          )

          started, completed = __import__("sys").argv[1:]
          commands = [
              "python3 -m unittest scripts.tests.test_candidate_lifecycle scripts.tests.test_gate_receipts scripts.tests.test_promotion_receipt_gate scripts.tests.test_phase_batch_lifecycle",
              "bash scripts/tests/test-gitops-phase-delivery.sh",
          ]
          identity = compute_candidate_identity(
              Path("."),
              [],
              "full",
              profile_files=[".github/linktrend-delivery-mode.json"],
              source_branch=os.environ["SOURCE_BRANCH"],
          )
          summary = Path("full-suite-summary.txt")
          summary.write_text(
              "workflow=Linktrend Full Suite\n"
              f"repository={os.environ['GITHUB_REPOSITORY']}\n"
              f"head={identity.head_commit}\n"
              "runner=ubuntu-24.04-arm\n",
              encoding="utf-8",
          )
          evidence = {
              "full-suite-summary.txt": "sha256:" + hashlib.sha256(summary.read_bytes()).hexdigest()
          }
          result = {
              "schemaVersion": 2,
              "candidateIdentity": identity.to_dict(),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runnerLabel": "ubuntu-24.04-arm",
              "startedAt": started,
              "completedAt": completed,
              "conclusion": "success",
              "commandDigest": canonical_digest({"profile": "full", "commands": commands}),
              "evidenceDigests": evidence,
          }
          write_receipt(result, Path("full-suite-receipt.json"))
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Upload retained full-suite receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-full-suite-receipt-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: |
            candidate/full-suite-receipt.json
            candidate/full-suite-summary.txt
          retention-days: 30

  bugbot:
    name: Linktrend Final Candidate Bugbot Request
    needs: full
    if: needs.full.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Request Bugbot once for the sealed candidate
        run: |
          set -euo pipefail
          marker="<!-- linktrend-bugbot-requested: ${HEAD_SHA} -->"
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body' || true)"
          if printf '%s\n' "${comments}" | grep -Fq "${marker}"; then
            echo "final_candidate_bugbot_request_already_recorded"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="@cursor review\n${marker}"
