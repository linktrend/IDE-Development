name: Linktrend Full Suite

# Full validation is an explicit seal-bound dispatch.  It never wakes from a
# checkpoint push or from opening a draft PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact Phase PR number
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  full:
    name: Linktrend Full Suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Capture start time
        id: clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact sealed Phase head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate live head and exact seal
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live="$(jq -r .head.sha <<<"${pr}")"
          live_branch="$(jq -r .head.ref <<<"${pr}")"
          live_repo="$(jq -r .head.repo.full_name <<<"${pr}")"
          case "${live_branch}" in phase/*) ;; *) echo "full_suite_requires_phase_branch=${live_branch}"; exit 1;; esac
          test "${live_repo}" = "${GITHUB_REPOSITORY}" || {
            echo "full_suite_repository_mismatch: expected=${GITHUB_REPOSITORY} live=${live_repo}"; exit 1;
          }
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${live}" || { echo "full_suite_stale_seal: live=${live} actual=${actual}"; exit 1; }
          fast="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${live}&per_page=100" --jq '[.workflow_runs[] | select(.name == "Linktrend Fast Checks" and .conclusion == "success")] | length')"
          test "${fast}" -gt 0 || { echo "full_suite_fast_check_missing_for_exact_head"; exit 1; }
          history="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=${live_branch}&per_page=100")"
          python3 - "${history}" "${live}" <<'PY'
          import json, sys
          runs = [r for r in json.loads(sys.argv[1]).get("workflow_runs", []) if r.get("name") == "Linktrend Full Suite"]
          heads = {r.get("head_sha") for r in runs if r.get("head_sha")}
          if len(heads) > 2 or sum(r.get("head_sha") == sys.argv[2] for r in runs) > 2:
              raise SystemExit("full_suite_candidate_or_attempt_limit")
          PY
          tree="$(git rev-parse 'HEAD^{tree}')"
          derived="$(python3 - "${GITHUB_REPOSITORY}" "${live_branch}" "${live}" "${tree}" <<'PY'
          import hashlib
          import json
          import sys
          repository, branch, head, tree = sys.argv[1:]
          identity = {
              "repository": repository,
              "sourceSha": head,
              "gitTreeSha": tree,
              "dependencyDigests": {},
              "testProfile": "full",
          }
          print("sha256:" + hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()).hexdigest())
          PY
          )"
          printf 'SOURCE_BRANCH=%s\nEXPECTED_HEAD=%s\nCANDIDATE_ID=%s\nSEAL_REVISION=1\nATTEMPT=%s\n' "${live_branch}" "${live}" "${derived}" "${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "exact dispatch-time seal accepted"

      - name: Run full profile
        working-directory: candidate
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest \
            scripts.tests.test_candidate_lifecycle \
            scripts.tests.test_gate_receipts \
            scripts.tests.test_promotion_receipt_gate \
            scripts.tests.test_phase_batch_lifecycle
          bash scripts/tests/test-gitops-phase-delivery.sh

      - name: Write exact full-suite receipt
        if: success()
        working-directory: candidate
        env:
          STARTED: ${{ steps.clock.outputs.started_at }}
        run: |
          set -euo pipefail
          COMPLETED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "${STARTED}" "${COMPLETED}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.gitops.coordinator.receipts import (
              canonical_digest,
              compute_candidate_identity,
              write_receipt,
          )

          started, completed = __import__("sys").argv[1:]
          commands = [
              "python3 -m unittest scripts.tests.test_candidate_lifecycle scripts.tests.test_gate_receipts scripts.tests.test_promotion_receipt_gate scripts.tests.test_phase_batch_lifecycle",
              "bash scripts/tests/test-gitops-phase-delivery.sh",
          ]
          identity = compute_candidate_identity(
              Path("."),
              [],
              "full",
              profile_files=[".github/linktrend-delivery-mode.json"],
              source_branch=os.environ["SOURCE_BRANCH"],
          )
          summary = Path("full-suite-summary.txt")
          summary.write_text(
              "workflow=Linktrend Full Suite\n"
              f"repository={os.environ['GITHUB_REPOSITORY']}\n"
              f"head={identity.head_commit}\n"
              "runner=ubuntu-24.04-arm\n",
              encoding="utf-8",
          )
          evidence = {
              "full-suite-summary.txt": "sha256:" + hashlib.sha256(summary.read_bytes()).hexdigest()
          }
          result = {
              "schemaVersion": 2,
              "candidateIdentity": identity.to_dict(),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runnerLabel": "ubuntu-24.04-arm",
              "startedAt": started,
              "completedAt": completed,
              "conclusion": "success",
              "commandDigest": canonical_digest({"profile": "full", "commands": commands}),
              "evidenceDigests": evidence,
          }
          write_receipt(result, Path("full-suite-receipt.json"))
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Upload retained full-suite receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-full-suite-receipt-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            candidate/full-suite-receipt.json
            candidate/full-suite-summary.txt
          retention-days: 30

  bugbot:
    name: Linktrend Final Candidate Bugbot Request
    needs: full
    if: needs.full.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Request Bugbot once for the sealed candidate
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          marker="<!-- linktrend-bugbot-requested: ${HEAD_SHA} -->"
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body' || true)"
          if printf '%s\n' "${comments}" | grep -Fq "${marker}"; then
            echo "final_candidate_bugbot_request_already_recorded"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="@cursor review\n${marker}"
