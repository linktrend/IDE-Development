name: LiNKtrend Repair Observer

# Observes CI / Branch Source Policy / Cursor Bugbot lifecycle events and
# maintains durable repair tasks. Does NOT mint a GitHub App token. Does NOT
# spawn Cursor.
#
# Trust boundary:
#   - checkout repository default branch only (never PR head)
#   - GITHUB_TOKEN with issues:write is enough to create/update Issues
#   - repair_observer.py proves current PR/branch head before resolving

on:
  workflow_run:
    workflows:
      - __LINKTREND_CI_WORKFLOW_NAME__
      - __LINKTREND_BRANCH_POLICY_WORKFLOW_NAME__
    types: [completed]
  check_run:
    types: [completed]

permissions: {}

concurrency:
  group: linktrend-repair-observer-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe repair lifecycle
    if: >
      (
        github.event_name == 'workflow_run' &&
        (
          github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'success'
        ) &&
        (
          github.event.workflow_run.name == '__LINKTREND_CI_WORKFLOW_NAME__' ||
          github.event.workflow_run.name == '__LINKTREND_BRANCH_POLICY_WORKFLOW_NAME__'
        )
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.name == '__LINKTREND_BUGBOT_CHECK_NAME__' &&
        (
          github.event.check_run.conclusion == 'failure' ||
          github.event.check_run.conclusion == 'success' ||
          github.event.check_run.conclusion == 'neutral'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Observe repair lifecycle (GITHUB_TOKEN only - no App mint)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          LINKTREND_CI_WORKFLOW_NAME: __LINKTREND_CI_WORKFLOW_NAME__
          LINKTREND_BRANCH_POLICY_WORKFLOW_NAME: __LINKTREND_BRANCH_POLICY_WORKFLOW_NAME__
          LINKTREND_BUGBOT_CHECK_NAME: __LINKTREND_BUGBOT_CHECK_NAME__
        run: python3 scripts/gitops/repair_observer.py handle-event --event-path "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"
