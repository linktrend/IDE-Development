name: Linktrend Main Receipt Gate

# Main promotion has the same short identity gate as staging.  Principal/Terra
# performs the actual protected-branch operation outside this workflow.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted default-branch workflow; candidate is data only and candidate code is never executed
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|head-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  branch-source-policy:
    name: Linktrend Branch Source Policy
    uses: ./.github/workflows/branch-source-policy.yml
    with:
      source_branch: ${{ github.event.pull_request.head.ref }}
      target_branch: main
    permissions:
      pull-requests: read

  receipt-gate:
    name: Linktrend Receipt Gate
    needs: branch-source-policy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact retained receipt coordinates
        id: receipt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SOURCE_BRANCH: staging
        run: |
          set -euo pipefail
          pr_body=""
          test -n "${PR_NUMBER}" || { echo "receipt_gate_pr_number_missing"; exit 1; }
          test -n "${GITHUB_REPOSITORY}" || { echo "receipt_gate_repository_missing"; exit 1; }
          pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)"
          export PR_BODY="${pr_body}"
          coordinates="$(python3 - <<'PY'
          import json, os, re
          match = re.search(r"<!-- linktrend-promote:\s*(\{.*?\})\s*-->", os.environ.get("PR_BODY", ""), re.S)
          if not match:
              raise SystemExit("receipt_gate_promotion_marker_missing")
          marker = json.loads(match.group(1))
          run_id = str(marker.get("fullRunId") or "").strip()
          attempt = str(marker.get("fullRunAttempt") or "").strip()
          digest = str(marker.get("transitionReceiptDigest") or "").strip().lower()
          source_branch = str(marker.get("sourceBranch") or "").strip()
          expected_source = os.environ.get("EXPECTED_SOURCE_BRANCH", "")
          if source_branch != expected_source:
              raise SystemExit("receipt_gate_source_branch_mismatch")
          artifact = ""
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("receipt_gate_full_run_invalid")
          if not attempt.isdigit() or int(attempt) < 1:
              raise SystemExit("receipt_gate_full_run_attempt_invalid")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("receipt_gate_transition_digest_missing")
          print(json.dumps({
              "runId": run_id,
              "runAttempt": attempt,
              "artifactName": artifact,
              "transitionDigest": digest,
              "sourceBranch": source_branch,
          }))
          PY
          )"
          run_id="$(jq -r .runId <<<"${coordinates}")"
          run_attempt="$(jq -r .runAttempt <<<"${coordinates}")"
          requested_name="$(jq -r .artifactName <<<"${coordinates}")"
          transition_digest="$(jq -r .transitionDigest <<<"${coordinates}")"
          source_branch="$(jq -r .sourceBranch <<<"${coordinates}")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e '.path == ".github/workflows/linktrend-integrator-merge.yml" and .event == "pull_request" and .conclusion == "success"' <<<"${run}" >/dev/null \
            || { echo "receipt_gate_full_run_not_reusable=${run_id}"; exit 1; }
          jq -e --argjson attempt "${run_attempt}" '.run_attempt == $attempt' <<<"${run}" >/dev/null \
            || { echo "receipt_gate_full_run_attempt_mismatch=${run_id}"; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_name="$(jq -r --arg requested "${requested_name}" --arg suffix "-${run_id}" '
            [.artifacts[] | select(.expired == false)
              | select(.name | startswith("linktrend-full-suite-receipt-"))
              | select(.name | endswith($suffix))
              | select($requested == "" or .name == $requested)]
            | if length == 1 then .[0].name else empty end
          ' <<<"${artifacts}")"
          test -n "${artifact_name}" || { echo "receipt_gate_artifact_not_unique_or_missing=${run_id}"; exit 1; }
          printf 'run_id=%s\nrun_attempt=%s\nartifact_name=%s\ntransition_digest=%s\nsource_branch=%s\n' \
            "${run_id}" "${run_attempt}" "${artifact_name}" "${transition_digest}" "${source_branch}" >> "$GITHUB_OUTPUT"

      - name: Fetch exact promotion candidate without executing it
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}" || { echo "receipt_gate_head_missing"; exit 1; }
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          candidate_dir="$(mktemp -d "${RUNNER_TEMP}/linktrend-receipt-candidate.XXXXXX")"
          git worktree add --detach "${candidate_dir}" "${HEAD_SHA}"
          echo "${candidate_dir}" > candidate-dir.txt

      - name: Download retained full-suite receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: receipt-artifact
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Fetch exact immutable transition receipt
        env:
          TRANSITION_DIGEST: ${{ steps.receipt.outputs.transition_digest }}
        run: |
          set -euo pipefail
          test -n "${TRANSITION_DIGEST}" || { echo "receipt_gate_transition_digest_missing"; exit 1; }
          ref_leaf="${TRANSITION_DIGEST/sha256:/sha256-}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/linktrend/transition-receipts/${ref_leaf}")"
          jq -e --arg leaf "${ref_leaf}" '.object.type == "blob" and (.ref | endswith("/" + $leaf))' <<<"${ref_json}" >/dev/null \
            || { echo "receipt_gate_transition_ref_not_unique_or_missing"; exit 1; }
          blob_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          test -n "${blob_sha}" || { echo "receipt_gate_transition_blob_missing"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" > transition-blob.json
          python3 "$GITHUB_WORKSPACE/scripts/gitops/promotion_receipt_gate.py" load-transition \
            --input transition-blob.json \
            --github-blob \
            --expected-digest "${TRANSITION_DIGEST}" \
            --output transition-receipt.json

      - name: Verify receipt identity and branch policy result
        env:
          RECEIPT_RUN_ID: ${{ steps.receipt.outputs.run_id }}
          RECEIPT_RUN_ATTEMPT: ${{ steps.receipt.outputs.run_attempt }}
          TRANSITION_DIGEST: ${{ steps.receipt.outputs.transition_digest }}
          SOURCE_BRANCH: ${{ steps.receipt.outputs.source_branch }}
        run: |
          set -euo pipefail
          candidate_dir="$(cat candidate-dir.txt)"
          # Direct-head Full receipt checks remain fail-closed via coordinator.receipts /
          # gate_receipt.py identity. Commit-changing protected reuse requires
          # promotion_receipt_gate.py --transition-receipt from a trusted git-ref blob.
          python3 "$GITHUB_WORKSPACE/scripts/gitops/promotion_receipt_gate.py" verify \
            --receipt receipt-artifact/full-suite-receipt.json \
            --repo "${candidate_dir}" \
            --profile full \
            --workflow-run-id "${RECEIPT_RUN_ID}" \
            --workflow-run-attempt "${RECEIPT_RUN_ATTEMPT}" \
            --transition-receipt transition-receipt.json \
            --expected-transition-digest "${TRANSITION_DIGEST}" \
            --source-branch "${SOURCE_BRANCH}" \
            --gate full-gate
          echo "Linktrend Receipt Gate passed: exact tree/dependency/profile/workflow identity reused with canonical transition receipt; no full suite rerun."
