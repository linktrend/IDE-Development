name: Linktrend Review Gate

# Classifies exact-head Cursor Bugbot provider results into the managed
# Linktrend Review Gate commit status (WP-U01). Never labels advisory
# unavailability as a Bugbot pass. Free-text provider heuristics are forbidden.
#
# Trust boundary: checkout and execute scripts only from the protected
# repository default branch. Candidate head/tree/receipt/provider evidence are
# data only (API), never a script execution source.

on:
  check_run:
    types: [completed]

permissions: {}

jobs:
  classify:
    name: Classify Bugbot into Linktrend Review Gate
    if: github.event.check_run.name == 'Cursor Bugbot'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write
      checks: read
      actions: read
    steps:
      - name: Checkout trusted default branch (scripts only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify, alert, fallback, and publish managed gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CHECK_CONCLUSION: ${{ github.event.check_run.conclusion }}
          CHECK_STATUS: ${{ github.event.check_run.status }}
          CHECK_ANNOTATIONS_COUNT: ${{ github.event.check_run.output.annotations_count }}
          FALLBACK_REVIEWER: ${{ vars.LINKTREND_REVIEW_GATE_FALLBACK_REVIEWER }}
          FALLBACK_IMPLEMENTER: ${{ vars.LINKTREND_REVIEW_GATE_IMPLEMENTER }}
          INDEPENDENT_REVIEW_CONFIGURED: ${{ vars.LINKTREND_INDEPENDENT_REVIEW_CONFIGURED }}
        run: |
          set -euo pipefail
          # Candidate identity as data only — never checkout/execute candidate scripts.
          TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq .tree.sha \
            | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "${TREE}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "HOLD: candidate_tree_unreadable"; exit 1
          fi
          PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].number // empty' || true)"

          # Trusted provider/Full evidence: GitHub Checks bound to authenticated
          # producer run/job/check-suite identity + default-branch workflow blob.
          # details_url alone is forgeable; never read candidate .linktrend/*.json.
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          CHECK_RUNS_FILE="$(mktemp)"
          WORKFLOW_RUNS_FILE="$(mktemp)"
          WORKFLOW_JOBS_FILE="$(mktemp)"
          WORKFLOW_FILE_SHAS_FILE="$(mktemp)"
          trap 'rm -f "${CHECK_RUNS_FILE}" "${WORKFLOW_RUNS_FILE}" "${WORKFLOW_JOBS_FILE}" "${WORKFLOW_FILE_SHAS_FILE}"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            >"${CHECK_RUNS_FILE}" \
            || { echo "HOLD: check_runs_unreadable"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            >"${WORKFLOW_RUNS_FILE}" \
            || { echo "HOLD: workflow_runs_unreadable"; exit 1; }
          python3 scripts/gitops/linktrend_review_gate.py resolve-workflow-jobs \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-runs-json "${WORKFLOW_RUNS_FILE}" \
            --output "${WORKFLOW_JOBS_FILE}" \
            || { echo "HOLD: workflow_jobs_unreadable"; exit 1; }
          python3 scripts/gitops/linktrend_review_gate.py resolve-workflow-file-shas \
            --repository "${GITHUB_REPOSITORY}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --workflow-runs-json "${WORKFLOW_RUNS_FILE}" \
            --output "${WORKFLOW_FILE_SHAS_FILE}" \
            || { echo "HOLD: workflow_file_shas_unreadable"; exit 1; }
          PROVIDER_EXTRACT="$(
            python3 scripts/gitops/linktrend_review_gate.py extract-trusted-provider-evidence \
              --head-sha "${HEAD_SHA}" \
              --default-branch "${DEFAULT_BRANCH}" \
              --check-runs-json "${CHECK_RUNS_FILE}" \
              --workflow-runs-json "${WORKFLOW_RUNS_FILE}" \
              --workflow-jobs-json "${WORKFLOW_JOBS_FILE}" \
              --workflow-file-shas-json "${WORKFLOW_FILE_SHAS_FILE}"
          )" || {
            echo "HOLD: provider_evidence_extract_failed"; exit 1
          }
          PROVIDER_JSON=""
          PROVIDER_CHANNEL=""
          if [ -n "${PROVIDER_EXTRACT}" ] && [ "${PROVIDER_EXTRACT}" != "null" ]; then
            PROVIDER_JSON="$(jq -c '.providerError // empty' <<<"${PROVIDER_EXTRACT}")"
            PROVIDER_CHANNEL="$(jq -r '.evidenceChannel // empty' <<<"${PROVIDER_EXTRACT}")"
            if [ -z "${PROVIDER_JSON}" ] || [ "${PROVIDER_JSON}" = "null" ]; then
              PROVIDER_JSON=""
              PROVIDER_CHANNEL=""
            fi
          fi

          # Infrastructure markers: paginated slurp via stdin (never argv / ARG_MAX).
          # pipefail keeps gh api/auth/pagination failures fail-closed (no [] reset).
          MARKERS_URL="repos/${GITHUB_REPOSITORY}/issues/comments"
          if [ -n "${PR_NUMBER}" ]; then
            MARKERS_URL="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          fi
          ATTEMPTS="$(
            gh api --paginate --slurp "${MARKERS_URL}" \
              | python3 scripts/gitops/linktrend_review_gate.py flatten-comment-bodies --slurp-json - \
              | python3 scripts/gitops/linktrend_review_gate.py count-infra-attempts \
                  --head-sha "${HEAD_SHA}" --markers-json - \
              | jq -r .attempts
          )" || { echo "HOLD: infra_marker_read_failed"; exit 1; }
          case "${ATTEMPTS}" in
            ''|*[!0-9]*) echo "HOLD: infra_marker_invalid_json"; exit 1 ;;
          esac
          if [ -n "${PROVIDER_JSON}" ]; then
            ATTEMPTS=$((ATTEMPTS + 1))
          fi

          # Structured findings only (annotations_count / action_required via classifier).
          # Never pass free-text check summaries into classification.
          ARGS=(
            python3 scripts/gitops/linktrend_review_gate.py classify
            --repository "${GITHUB_REPOSITORY}"
            --head-sha "${HEAD_SHA}"
            --git-tree "${TREE}"
            --bugbot-state "${CHECK_STATUS}"
            --bugbot-conclusion "${CHECK_CONCLUSION}"
            --infrastructure-attempts "${ATTEMPTS}"
            --result-head-sha "${HEAD_SHA}"
          )
          if [ -n "${CHECK_ANNOTATIONS_COUNT}" ]; then
            case "${CHECK_ANNOTATIONS_COUNT}" in
              ''|*[!0-9]*) echo "HOLD: annotations_count_invalid"; exit 1 ;;
              *) ARGS+=(--annotations-count "${CHECK_ANNOTATIONS_COUNT}") ;;
            esac
          fi
          if [ -n "${PR_NUMBER}" ]; then
            ARGS+=(--pull-request "${PR_NUMBER}")
          fi
          if [ -n "${PROVIDER_JSON}" ]; then
            ARGS+=(--provider-error-json "${PROVIDER_JSON}")
            ARGS+=(--provider-evidence-channel "${PROVIDER_CHANNEL}")
          fi
          OUT="$("${ARGS[@]}")"
          echo "${OUT}"
          STATE="$(jq -r .commitStatus.state <<<"${OUT}")"
          DESC="$(jq -r .commitStatus.description <<<"${OUT}")"
          CONTEXT="$(jq -r .commitStatus.context <<<"${OUT}")"
          CLAIM="$(jq -r .classification.bugbotPassedClaim <<<"${OUT}")"
          OUTCOME="$(jq -r .classification.outcome <<<"${OUT}")"
          GATE_SUCCESS="$(jq -r .classification.gateSuccess <<<"${OUT}")"
          ALERT="$(jq -r .classification.alertFounder <<<"${OUT}")"
          if [ "${OUTCOME}" = "advisory-unavailable" ] && [ "${CLAIM}" = "true" ]; then
            echo "advisory_must_not_claim_bugbot_pass"; exit 1
          fi

          # Exact Full receipt/check required before publishing a successful gate.
          # Preserve receipt-provided gitTree; never overwrite with live TREE.
          # Full evidence must come from trusted GitHub Checks — never candidate files.
          if [ "${GATE_SUCCESS}" = "true" ]; then
            FULL_EXTRACT="$(
              python3 scripts/gitops/linktrend_review_gate.py extract-trusted-full-receipt \
                --head-sha "${HEAD_SHA}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --check-runs-json "${CHECK_RUNS_FILE}" \
                --workflow-runs-json "${WORKFLOW_RUNS_FILE}" \
                --workflow-jobs-json "${WORKFLOW_JOBS_FILE}" \
                --workflow-file-shas-json "${WORKFLOW_FILE_SHAS_FILE}"
            )" \
              || { echo "full_receipt_check_lookup_failed"; exit 1; }
            if [ -z "${FULL_EXTRACT}" ] || [ "${FULL_EXTRACT}" = "null" ]; then
              echo "full_receipt_missing_trusted_check"; exit 1
            fi
            FULL_JSON="$(jq -c '.receipt' <<<"${FULL_EXTRACT}")"
            FULL_CHANNEL="$(jq -r '.evidenceChannel' <<<"${FULL_EXTRACT}")"
            python3 scripts/gitops/linktrend_review_gate.py require-full-receipt \
              --gate-success \
              --full-receipt-json "${FULL_JSON}" \
              --head-sha "${HEAD_SHA}" \
              --git-tree "${TREE}" \
              --evidence-channel "${FULL_CHANNEL}"
          fi

          # Durable founder alert (deduped via prior alert ISSUE BODIES) — fail closed.
          # Slurp payloads enter flatten/dedupe via stdin (--slurp-json - / --issue-bodies-json -).
          if [ "${ALERT}" = "true" ]; then
            CLASS_JSON="$(jq -c .classification <<<"${OUT}")"
            ALERT_JSON="$(python3 scripts/gitops/linktrend_review_gate.py founder-alert \
              --classification-json "${CLASS_JSON}")"
            DECISION="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues?state=all&filter=all&per_page=100" \
                | python3 scripts/gitops/linktrend_review_gate.py flatten-issue-bodies --slurp-json - \
                | python3 scripts/gitops/linktrend_review_gate.py founder-alert-dedupe \
                    --head-sha "${HEAD_SHA}" \
                    --issue-bodies-json - \
                    --alert-required \
                    --bodies-readable
            )" || { echo "HOLD: founder_alert_dedupe_unreadable"; exit 1; }
            echo "${DECISION}" | jq -e 'type=="object"' >/dev/null \
              || { echo "HOLD: founder_alert_dedupe_unreadable"; exit 1; }
            if [ "$(jq -r .publish <<<"${DECISION}")" = "true" ]; then
              TITLE="$(jq -r .title <<<"${ALERT_JSON}")"
              BODY="$(jq -r .body <<<"${ALERT_JSON}")"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="${TITLE}" \
                -f body="${BODY}" >/tmp/review-gate-alert.json \
                || { echo "founder_alert_publish_failed"; exit 1; }
            fi
            # Record infrastructure attempt marker — fail closed when accounting cannot persist.
            INFRA_MARKER="$(jq -r '.infraAttemptMarker // empty' <<<"${OUT}")"
            if [ -n "${INFRA_MARKER}" ]; then
              [ -n "${PR_NUMBER}" ] || { echo "infra_attempt_marker_requires_pr"; exit 1; }
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="${INFRA_MARKER}" >/dev/null \
                || { echo "infra_attempt_marker_persist_failed"; exit 1; }
            fi
          fi

          # Wire fallback review for advisory-unavailable when configured.
          if [ "${OUTCOME}" = "advisory-unavailable" ] && [ "${INDEPENDENT_REVIEW_CONFIGURED}" = "true" ]; then
            [ -n "${FALLBACK_REVIEWER}" ] || { echo "fallback_reviewer_missing"; exit 1; }
            [ -n "${FALLBACK_IMPLEMENTER}" ] || { echo "fallback_implementer_missing"; exit 1; }
            FALLBACK="$(python3 scripts/gitops/linktrend_review_gate.py fallback \
              --outcome "${OUTCOME}" \
              --independent-review-configured \
              --reviewer-actor "${FALLBACK_REVIEWER}" \
              --implementer-actor "${FALLBACK_IMPLEMENTER}" \
              --evidence-head "${HEAD_SHA}" \
              --live-head "${HEAD_SHA}")"
            COMMENT="$(python3 scripts/gitops/linktrend_review_gate.py fallback-comment \
              --fallback-json "${FALLBACK}" --head-sha "${HEAD_SHA}")"
            if [ "$(jq -r .posted <<<"${COMMENT}")" = "true" ]; then
              [ -n "${PR_NUMBER}" ] || { echo "fallback_requires_pr"; exit 1; }
              BODY="$(jq -r .body <<<"${COMMENT}")"
              EXISTING="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --jq '.[].body' || true)"
              MARKER="$(jq -r .marker <<<"${COMMENT}")"
              if ! printf '%s\n' "${EXISTING}" | grep -Fq "${MARKER}"; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -f body="${BODY}" >/dev/null
              fi
            fi
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="${CONTEXT}" \
            -f description="${DESC}"
