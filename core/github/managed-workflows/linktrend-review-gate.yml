name: Retired Bugbot Review Gate

# Compatibility tombstone: no provider event, review request, status publication,
# automatic approval, credentials, or candidate execution. External protections
# retaining the retired context require separately approved ruleset migration.
on:
  workflow_dispatch:
permissions: {}
jobs:
  retired:
    name: Retired review route
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain retired route
        run: |
          echo "Bugbot is disabled. Use exact-head independent review and sealed test receipts."
          exit 1
