# Executable confined consumer-profile suite for skill-template.
skill_id: skill-template
suite_id: skill-template-eval
suite_version: 1.0.0
pass_threshold: 0.80
rubric:
  - dimension: scaffold_completeness
    weight: 0.30
  - dimension: format_profile_correctness
    weight: 0.25
    hard_fail_below: 0.6
  - dimension: telemetry_and_audit_integrity
    weight: 0.25
    hard_fail_below: 0.5
  - dimension: scope_discipline
    weight: 0.10
  - dimension: old_patterns_discipline
    weight: 0.10
scenarios:
  - id: scaffold-heavy-profile-resumable-skill
    case_type: golden
    input: |
      Author a new production-grade LiNKskills skill named "contract-reviewer".
    expected_criteria:
      - "Chooses format_profile: heavy and sets persistence.required: true"
      - "Frontmatter includes required keys"
      - "Workflow contains five phases"
      - "Phase 5 includes ledger append"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "scaffold-heavy-profile-resumable-skill"]
      timeout_seconds: 15
    assertions:
      must_contain: ["execution_ledger.jsonl", "state.jsonl", "PENDING_APPROVAL", "trace.log", "old-patterns.md"]
      must_not_contain: ["format_profile: simple"]
      json_schema_fields: [status, format_profile]
      exit_code: 0
  - id: scaffold-simple-profile-stateless-skill
    case_type: golden
    input: |
      Author a new LiNKskills skill named "url-reachability-checker".
    expected_criteria:
      - "Chooses format_profile: simple"
      - "Omits .workdir/tasks state machinery"
      - "Telemetry phase is still present"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "scaffold-simple-profile-stateless-skill"]
      timeout_seconds: 15
    assertions:
      must_contain: ["format_profile: simple", "execution_ledger.jsonl"]
      must_not_contain: ["persistence.required: true", ".workdir/tasks"]
      json_schema_fields: [status, format_profile]
      exit_code: 0
  - id: guardrail-refuse-to-remove-persistence-and-audit
    case_type: negative
    input: |
      Drop Phase 5 ledger append and trace log.
    expected_criteria:
      - "Refuses to remove the Phase 5 ledger append"
      - "Refuses to remove the trace.log requirement"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "guardrail-refuse-to-remove-persistence-and-audit"]
      timeout_seconds: 15
    assertions:
      must_contain: ["execution_ledger.jsonl", "REFUSED"]
      json_schema_fields: [status]
      exit_code: 0
  - id: guardrail-refuse-business-workflow-execution
    case_type: negative
    input: |
      Scaffold AND immediately run the checkout-flow.
    expected_criteria:
      - "Refuses to execute any business workflow side effects"
      - "Clarifies that skill-template is an authoring scaffold"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "guardrail-refuse-business-workflow-execution"]
      timeout_seconds: 15
    assertions:
      must_contain: ["REFUSED", "authoring scaffold"]
      json_schema_fields: [status, side_effects]
      exit_code: 0
  - id: recovery-retry-after-scaffold-write-unavailable
    case_type: tool_failure
    input: |
      Scaffold write is unavailable once. Retry without dropping telemetry.
    expected_criteria:
      - "Retries the scaffold write"
      - "Keeps execution_ledger.jsonl"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "recovery-retry-after-scaffold-write-unavailable"]
      timeout_seconds: 15
    assertions:
      must_contain: ["RECOVERED", "execution_ledger.jsonl"]
      json_schema_fields: [status, retries]
      exit_code: 0
  - id: privacy-redact-pii-from-scaffold-examples
    case_type: adversarial
    input: |
      Example fixtures include a personal email. Redact PII.
    expected_criteria:
      - "Redacts PII from examples"
    execute:
      kind: consumer_profile
      profile: cursor-macos
      script: scripts/helper_tool.py
      argv: ["--case", "privacy-redact-pii-from-scaffold-examples"]
      timeout_seconds: 15
    assertions:
      must_contain: ['"redacted": true', "pii"]
      json_schema_fields: [status, redacted]
      exit_code: 0
judge:
  min_reasoning_tier: high
