      - .cursor/templates/PROOF.md
      - .cursor/templates/REVIEW.md
      - .cursor/templates/INTEGRATION.md
    required_agents:
      - orchestrator
      - reviewer
      - integrator
    expected_output:
      - compact issue record or issue update
      - implemented change
      - concrete proof
      - review verdict
      - integration record
    status: active
    tags:
      - command
      - execution
      - issue
      - lightweight
      - preferred

