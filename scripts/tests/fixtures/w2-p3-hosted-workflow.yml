name: Linktrend Fast Checks
on:
  pull_request:
permissions:
  contents: read
  actions: none
  pull-requests: none
  statuses: none
jobs:
  fast:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    concurrency:
      group: ${{ github.repository }}:${{ github.workflow }}:${{ github.event.pull_request.number }}
      cancel-in-progress: true
